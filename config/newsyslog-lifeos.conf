# LifeOS log rotation config for newsyslog
# Install: sed "s|__LIFEOS_PATH__|$(pwd)|g; s|__USER__|$(whoami)|g" config/newsyslog-lifeos.conf | sudo tee /etc/newsyslog.d/lifeos.conf
#
# Format: logfile [owner:group] mode count size(KB) when flags
__LIFEOS_PATH__/logs/server.log            __USER__:staff 644 5 10240 * J
__LIFEOS_PATH__/logs/lifeos-api.log        __USER__:staff 644 5 10240 * J
__LIFEOS_PATH__/logs/lifeos-api-error.log  __USER__:staff 644 5 10240 * J
__LIFEOS_PATH__/logs/crm-sync.log          __USER__:staff 644 5 10240 * J
__LIFEOS_PATH__/logs/backup.log            __USER__:staff 644 3 1024  * J
