# Wait for ChromaDB to answer before starting the API. Without this,
# lifeos-api can start in the same second as lifeos-chromadb and exit
# with "ChromaDB server not running" (seen after WSL restarts).
[Service]
ExecStartPre=/bin/bash -c 'for i in $(seq 1 60); do curl -sf -m 2 http://127.0.0.1:8001/api/v2/heartbeat >/dev/null && exit 0; sleep 2; done; echo "ChromaDB not ready after 120s" >&2; exit 1'
