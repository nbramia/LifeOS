# XcodeGen spec for HealthBridge (#333).
# Generate the Xcode project with:  xcodegen generate
# Then open HealthBridge.xcodeproj, set your signing team, and run to your iPhone.
name: HealthBridge
options:
  bundleIdPrefix: tech.lifeos
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # Set your own free-Apple-ID team in Xcode (Signing & Capabilities) or here:
    # DEVELOPMENT_TEAM: ABCDE12345

targets:
  HealthBridge:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: HealthBridge
        UILaunchScreen: {}
        NSHealthShareUsageDescription: "HealthBridge reads your workouts and health metrics so LifeOS can track training and recovery."
        NSHealthUpdateUsageDescription: "HealthBridge does not write health data; read-only access only."
        UIBackgroundModes:
          - processing
          - fetch
    entitlements:
      path: HealthBridge.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.lifeos.healthbridge
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"  # iPhone
