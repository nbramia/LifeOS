# XcodeGen spec for HealthBridge.
# Copy Secrets.xcconfig.example to Secrets.xcconfig (gitignored), then:  xcodegen generate
name: HealthBridge
options:
  bundleIdPrefix: com.nbramia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 872CQP9C37
    CODE_SIGN_STYLE: Automatic

targets:
  HealthBridge:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: HealthBridge
        UILaunchScreen: {}
        NSHealthShareUsageDescription: "HealthBridge reads your workouts and health metrics so LifeOS can track training and recovery."
        NSHealthUpdateUsageDescription: "HealthBridge does not write health data; read-only access only."
        # Preset server settings from Secrets.xcconfig; editable in the app.
        HBIngestURL: $(HB_INGEST_URL)
        HBIngestToken: $(HB_INGEST_TOKEN)
        UIBackgroundModes:
          - processing
          - fetch
    entitlements:
      path: HealthBridge.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nbramia.healthbridge
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"  # iPhone
