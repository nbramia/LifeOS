<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
  </defs>
  <!-- Background disc -->
  <circle cx="16" cy="16" r="15" fill="#1a1a2e"/>
  <!-- Bold "L" mark (LifeOS), rounded caps for a clean silhouette at small sizes -->
  <path d="M9 7 L9 23 L23 23" stroke="url(#grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Two accent nodes at the mark's endpoints -->
  <circle cx="9" cy="7" r="2.4" fill="#e94560"/>
  <circle cx="23" cy="23" r="2.4" fill="#ff6b6b"/>
</svg>
