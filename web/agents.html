<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agents · LifeOS</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-primary: #0a0a0f;
    --bg-secondary: #12121a;
    --bg-card: #1a1a24;
    --bg-elev: #20202c;
    --text-primary: #e8e8ed;
    --text-secondary: #8888a0;
    --text-dim: #5a5a6e;
    --accent: #6366f1;
    --border: #2a2a3a;
    --running: #34d399;
    --running-glow: rgba(52, 211, 153, 0.45);
    --claimed: #60a5fa;
    --yielded: #fbbf24;
    --blocked: #fb923c;
    --completed: #6b7280;
    --failed: #f87171;
  }
  * {
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  *::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }
  *::-webkit-scrollbar-track {
    background: transparent;
  }
  *::-webkit-scrollbar-thumb {
    background-color: var(--border);
    border-radius: 6px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  *::-webkit-scrollbar-thumb:hover {
    background-color: var(--text-dim);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.75rem 1.25rem;
    border-bottom: 1px solid var(--border);
    background: var(--bg-secondary);
    height: 56px;
  }
  header h1 {
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  header h1 a {
    color: var(--text-primary);
    text-decoration: none;
  }
  header h1 .crumb {
    color: var(--text-dim);
    font-weight: 400;
    margin: 0 0.5rem;
  }
  .header-nav {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    margin-left: 1rem;
  }
  .nav-link {
    display: flex;
    align-items: center;
    gap: 0.375rem;
    padding: 0.375rem 0.75rem;
    border-radius: 6px;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-secondary);
    transition: all 0.2s;
  }
  .nav-link:hover {
    background: var(--bg-card);
    color: var(--text-primary);
  }
  .nav-link.active {
    background: var(--accent);
    color: var(--bg-primary);
  }
  .chips {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-left: auto;
  }
  .chips[hidden] { display: none; }
  .chip {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.25rem 0.75rem;
    font-size: 0.75rem;
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .chip strong { color: var(--text-primary); font-weight: 600; margin-right: 0.25rem; }
  .chip.running strong { color: var(--running); }
  .chip.blocked strong { color: var(--blocked); }
  .chip.spend strong { color: var(--accent); }
  .filters {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    padding: 0.5rem 1.25rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.8rem;
    background: var(--bg-primary);
    color: var(--text-secondary);
  }
  .filters label { display: flex; align-items: center; gap: 0.35rem; cursor: pointer; }
  .filters select, .filters input[type="text"] {
    background: var(--bg-card);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.25rem 0.5rem;
    font-size: 0.8rem;
  }
  /* Search box + live results dropdown (issue #252). The wrapper is the
     positioning context for the absolutely-placed results list. */
  .search-wrap { position: relative; }
  .search-wrap input {
    background: var(--bg-card);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.25rem 0.5rem;
    font-size: 0.8rem;
    width: 200px;
  }
  .search-wrap input:focus { outline: none; border-color: var(--accent); }
  .search-results {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    width: 360px;
    max-height: 50vh;
    overflow-y: auto;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    padding: 0.25rem 0;
    z-index: 50;
  }
  .search-results[hidden] { display: none; }
  .search-group-label {
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    padding: 0.4rem 0.6rem 0.2rem;
  }
  .search-result {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    background: transparent;
    color: var(--text-primary);
    padding: 0.3rem 0.6rem;
    cursor: pointer;
  }
  .search-result:hover,
  .search-result.active { background: var(--bg-primary); }
  .search-result .sr-title {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.8rem;
  }
  .search-result .sr-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .search-result .sr-badge {
    flex: none;
    margin-left: auto;
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0 0.35rem;
  }
  .search-result .sr-snippet {
    font-size: 0.72rem;
    color: var(--text-secondary);
    margin-top: 0.1rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .search-result mark {
    background: var(--accent);
    color: #fff;
    border-radius: 2px;
    padding: 0 1px;
  }
  .search-group.hidden-group .search-result { opacity: 0.5; }
  .search-empty {
    padding: 0.5rem 0.6rem;
    font-size: 0.75rem;
    color: var(--text-dim);
  }
  main {
    display: grid;
    grid-template-columns: 1fr var(--panel-width, 360px);
    height: calc(100vh - 56px - 41px);
  }
  /* Drag handle on the left edge of the side panel — col-resize cursor,
     pure CSS visual feedback on hover/active. Drag logic in JS persists
     the width to localStorage so it survives reload. */
  .panel-resizer {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 5px;
    cursor: col-resize;
    background: transparent;
    transition: background 0.15s ease;
    z-index: 10;
  }
  .panel-resizer:hover,
  .panel-resizer.dragging {
    background: var(--accent);
  }
  aside.panel { position: relative; }
  .panel-content {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: 100%;
    padding-left: 5px;  /* leave room for the resizer strip */
  }
  #graph {
    background: var(--bg-primary);
    position: relative;
    overflow: hidden;
  }
  #graph-svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  /* D3 force-graph styles */
  #graph-svg .link {
    stroke: #3a3a4a;
    stroke-width: 1.2;
    fill: none;
    opacity: 0.7;
    pointer-events: none;
  }
  #graph-svg .node-shape {
    cursor: grab;
    transition: stroke-width 0.2s ease, filter 0.2s ease;
  }
  #graph-svg .node-shape:active {
    cursor: grabbing;
  }
  #graph-svg .node-shape:hover {
    stroke: #e8e8ed;
    filter: brightness(1.15);
  }
  #graph-svg .node-label {
    font: 12px system-ui, -apple-system, sans-serif;
    fill: #e8e8ed;
    text-anchor: middle;
    pointer-events: none;
    user-select: none;
  }
  /* Pulse animation for actively-writing nodes (last 60s of activity).
     White border that alternates thick / thin via CSS keyframe — no JS
     polling required. */
  @keyframes node-pulse {
    0%, 100% { stroke: var(--running); stroke-width: 2; }
    50%      { stroke: #ffffff;        stroke-width: 5; }
  }
  #graph-svg .node-shape.pulsing {
    animation: node-pulse 1.4s ease-in-out infinite;
  }
  /* Selection emphasis — `!important` on stroke beats the pulsing keyframe
     when both apply (selected actively-writing node prefers selection cue). */
  #graph-svg .node-shape.selected {
    stroke: #ffffff !important;
    stroke-width: 5 !important;
    animation: none !important;
  }
  #graph-svg .node-shape.related {
    stroke: rgba(255, 255, 255, 0.78) !important;
    stroke-width: 3 !important;
    animation: none !important;
  }
  #graph-svg .node-shape.dimmed {
    opacity: 0.28;
  }
  #graph-svg .node-label.dimmed {
    opacity: 0.35;
  }
  #graph-svg .link.highlighted {
    stroke: #ffffff;
    stroke-width: 2.4;
    opacity: 1;
  }
  #graph-svg .link.dimmed {
    opacity: 0.18;
  }
  #graph .empty-state {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    gap: 0.5rem;
    pointer-events: none;
  }
  #graph .empty-state .icon { font-size: 2.5rem; opacity: 0.5; }
  #graph .empty-state .label { font-size: 0.95rem; }
  #graph .empty-state .hint { font-size: 0.8rem; color: var(--text-dim); }
  aside.panel {
    background: var(--bg-secondary);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    padding: 1rem;
    border-bottom: 1px solid var(--border);
  }
  .panel-header .label {
    font-size: 0.95rem;
    font-weight: 600;
    word-break: break-word;
    cursor: pointer;
    border-radius: 4px;
    padding: 1px 4px;
    margin: -1px -4px;
    transition: background 0.12s;
  }
  .panel-header .label:hover { background: var(--bg-elev); }
  .panel-header .meta {
    color: var(--text-secondary);
    font-size: 0.75rem;
    margin-top: 0.25rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 0.75rem;
  }
  .panel-header .meta .badge {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 0.1rem 0.5rem;
    border-radius: 4px;
    font-size: 0.7rem;
  }
  .badge.status-running { color: var(--running); border-color: var(--running); }
  .badge.status-claimed { color: var(--claimed); border-color: var(--claimed); }
  .badge.status-yielded { color: var(--yielded); border-color: var(--yielded); }
  .badge.status-inactive { color: var(--yielded); border-color: var(--yielded); }
  .badge.status-idle { color: var(--yielded); border-color: var(--yielded); }
  .badge.status-blocked { color: var(--blocked); border-color: var(--blocked); }
  .badge.status-completed { color: var(--completed); border-color: var(--completed); }
  .badge.status-ended { color: var(--completed); border-color: var(--completed); }
  .badge.status-failed,
  .badge.status-budget_exceeded { color: var(--failed); border-color: var(--failed); }
  .panel-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    padding: 2rem;
    text-align: center;
    font-size: 0.85rem;
  }
  .session-summary {
    padding: 0.55rem 0.7rem 0.65rem;
    border-bottom: 1px solid var(--border);
    background: var(--bg-elev);
    font-size: 0.78rem;
    line-height: 1.45;
  }
  .session-summary .ss-label {
    font-size: 0.65rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 0.25rem;
  }
  .session-summary .ss-short {
    font-weight: 600;
    color: var(--text-primary);
    font-size: 0.92rem;
    margin-bottom: 0.35rem;
  }
  .session-summary .ss-body {
    color: var(--text-secondary);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .session-summary .ss-body ul {
    margin: 0.1rem 0 0;
    padding-left: 1.1rem;
  }
  .session-summary .ss-body li { margin: 0.1rem 0; }
  .session-summary.loading .ss-body {
    color: var(--text-dim);
    font-style: italic;
  }
  .events {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem;
  }
  .event {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.45rem 0.6rem;
    margin-bottom: 0.4rem;
    font-size: 0.78rem;
    line-height: 1.35;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .event.kind-tool_call { border-left: 2px solid var(--accent); }
  .event.kind-failed,
  .event.kind-managed_failed,
  .event.kind-child_failed_internal,
  .event.kind-killed,
  .event.kind-cascade_killed { border-left: 2px solid var(--failed); }
  .event.kind-spawn,
  .event.kind-spawned_child { border-left: 2px solid var(--claimed); }
  .event.kind-final { border-left: 2px solid var(--running); }
  .event .kind {
    color: var(--text-primary);
    font-weight: 600;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 0.72rem;
    cursor: pointer;
    padding: 0.05rem 0.3rem;
    border-radius: 3px;
    transition: background 0.12s ease;
  }
  .event .kind:hover {
    background: var(--bg-elev);
    color: var(--accent);
  }
  .event .kind.kind-active-filter {
    background: var(--accent);
    color: var(--bg-primary);
  }
  .event .ts {
    color: var(--text-dim);
    font-size: 0.68rem;
    margin-left: 0.5rem;
  }
  .event .payload {
    color: var(--text-secondary);
    margin-top: 0.2rem;
    word-break: break-word;
    white-space: pre-wrap;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 0.7rem;
    max-height: 8rem;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* Click anywhere on a feed item (except the kind label, which filters)
     to expand it — full untruncated payload + white text. Click again to
     collapse. The cursor signals affordance only on the content area. */
  .event .payload { cursor: pointer; }
  .event.expanded {
    background: var(--bg-elev);
  }
  .event.expanded .payload {
    color: var(--text-primary);
    max-height: none;
    overflow: visible;
    text-overflow: clip;
  }
  /* Pretty payload — replaces raw JSON in the collapsed view. The raw JSON
     is still emitted in a sibling .payload-raw <pre> revealed on expand,
     so power users can still inspect the full shape. */
  .event .payload {
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 0.78rem;
    line-height: 1.5;
    max-height: 14rem;
  }
  .event .payload-raw {
    display: none;
    margin-top: 0.35rem;
    padding-top: 0.35rem;
    border-top: 1px dashed var(--border);
    color: var(--text-secondary);
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 0.7rem;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 20rem;
    overflow-y: auto;
  }
  .event.expanded .payload-raw { display: block; }
  .pp-text {
    color: var(--text-primary);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .pp-text.muted { color: var(--text-dim); font-style: italic; }
  .pp-routing {
    color: var(--text-primary);
    margin-top: 0.15rem;
  }
  .pp-routing .pp-target {
    color: var(--accent);
    font-weight: 600;
  }
  .pp-routing .pp-reason { color: var(--text-secondary); }
  .pp-field {
    margin-top: 0.25rem;
    color: var(--text-secondary);
  }
  .pp-field .pp-label,
  .pp-budget .pp-label,
  .pp-usage  .pp-label,
  .pp-kv     .pp-label,
  .pp-badge  .pp-label {
    text-transform: uppercase;
    font-size: 0.62rem;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    margin-right: 0.3rem;
  }
  .pp-field .pp-value {
    color: var(--text-primary);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .pp-tools {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
    margin-top: 0.3rem;
  }
  .pp-tool {
    display: inline-flex;
    align-items: baseline;
    gap: 0.3rem;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 0.72rem;
  }
  .pp-tool .pp-tool-name { color: var(--accent); font-weight: 600; }
  .pp-tool .pp-tool-args { color: var(--text-dim); }
  .pp-budget, .pp-usage {
    margin-top: 0.25rem;
    color: var(--text-secondary);
  }
  .pp-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
    margin-top: 0.3rem;
  }
  .pp-badge {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.05rem 0.4rem;
    font-size: 0.7rem;
    color: var(--text-primary);
  }
  .pp-badge.pp-warn { color: var(--blocked); border-color: var(--blocked); }
  .pp-extra {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 0.9rem;
    margin-top: 0.3rem;
    color: var(--text-secondary);
  }
  .pp-empty { color: var(--text-dim); font-style: italic; }
  .panel-close {
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 1.25rem;
    line-height: 1;
    padding: 0.15rem 0.4rem;
    border-radius: 4px;
    float: right;
  }
  .panel-close:hover { background: var(--bg-card); color: var(--text-primary); }
  .panel-kill {
    background: var(--bg-card);
    border: 1px solid var(--failed);
    color: var(--failed);
    cursor: pointer;
    font-size: 0.75rem;
    line-height: 1;
    padding: 0.3rem 0.55rem;
    border-radius: 4px;
    float: right;
    margin-right: 0.5rem;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .panel-kill:hover { background: var(--failed); color: var(--bg-primary); }
  .panel-kill:disabled {
    opacity: 0.6;
    cursor: progress;
  }
  .panel-resume {
    background: var(--bg-card);
    border: 1px solid var(--accent);
    color: var(--accent);
    cursor: pointer;
    font-size: 0.75rem;
    line-height: 1;
    padding: 0.3rem 0.55rem;
    border-radius: 4px;
    float: right;
    margin-right: 0.5rem;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .panel-resume:hover { background: var(--accent); color: var(--bg-primary); }
  .panel-resume:disabled { opacity: 0.6; cursor: progress; }
  .panel-focus {
    background: var(--bg-card);
    border: 1px solid var(--text-dim);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 0.75rem;
    line-height: 1;
    padding: 0.3rem 0.55rem;
    border-radius: 4px;
    float: right;
    margin-right: 0.5rem;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .panel-focus:hover { background: var(--text-dim); color: var(--bg-primary); }
  .panel-focus:disabled { opacity: 0.6; cursor: progress; }
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
    animation: fadeIn 0.15s ease;
  }
  .modal {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    width: min(420px, 90vw);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal h2 {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 0.6rem;
  }
  .modal .target {
    color: var(--text-secondary);
    font-size: 0.8rem;
    margin-bottom: 0.5rem;
    word-break: break-word;
  }
  .modal .descendants {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.5rem 0.75rem;
    font-size: 0.75rem;
    color: var(--text-secondary);
    margin: 0.5rem 0;
    max-height: 6rem;
    overflow-y: auto;
  }
  .modal textarea {
    width: 100%;
    background: var(--bg-elev);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.6rem;
    font-family: inherit;
    font-size: 0.8rem;
    resize: vertical;
    min-height: 3rem;
    margin: 0.5rem 0;
  }
  .modal .actions {
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
    margin-top: 0.75rem;
  }
  .modal button {
    background: var(--bg-elev);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.85rem;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .modal button.danger {
    background: var(--failed);
    color: var(--bg-primary);
    border-color: var(--failed);
    font-weight: 600;
  }
  .modal button:hover { filter: brightness(1.15); }
  .toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem 1rem;
    font-size: 0.85rem;
    box-shadow: 0 6px 24px rgba(0,0,0,0.4);
    z-index: 110;
    animation: fadeIn 0.2s ease;
  }
  .toast.error { border-color: var(--failed); color: var(--failed); }
  .live-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--running);
    box-shadow: 0 0 6px var(--running-glow);
    margin-right: 0.4rem;
    animation: pulse 1.4s ease-in-out infinite;
    vertical-align: middle;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }
  @media (max-width: 800px) {
    main {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr auto;
    }
    aside.panel {
      max-height: 50vh;
      border-left: none;
      border-top: 1px solid var(--border);
    }
    .chips { display: none; }
  }

  /* -------------------------------------------------------------------
     Board tab (#850) — Kanban board that reuses the styles above for
     chips, panel-*, modal-*, and toast markup (the drawer's session
     panel section renders the same `.panel-header` / `.events` / etc.
     structure SessionPanel builds for the Graph tab).
     ------------------------------------------------------------------- */
  .tabs {
    display: flex;
    gap: 0.25rem;
    margin-left: 0.5rem;
  }
  .tab-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 0.85rem;
    font-weight: 500;
    padding: 0.375rem 0.75rem;
    border-radius: 6px;
    cursor: pointer;
  }
  .tab-btn:hover { background: var(--bg-card); color: var(--text-primary); }
  .tab-btn.active { background: var(--accent); color: var(--bg-primary); }
  .tab-view[hidden] { display: none; }
  #board-view {
    height: calc(100vh - 56px - 45px);
    display: flex;
    flex-direction: column;
  }
  #board-view[hidden] { display: none; }
  .board-filters {
    display: flex;
    gap: 0.6rem;
    align-items: center;
    padding: 0.5rem 1.25rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.8rem;
    color: var(--text-secondary);
    flex-wrap: wrap;
  }
  .board-filters select,
  .board-filters input[type="text"],
  .board-filters input[type="search"] {
    background: var(--bg-card);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.25rem 0.5rem;
    font-size: 0.8rem;
  }
  .board-filters label { display: flex; align-items: center; gap: 0.3rem; cursor: pointer; }
  #board-new-card {
    margin-left: auto;
    background: var(--accent);
    color: var(--bg-primary);
    border: none;
    border-radius: 6px;
    padding: 0.35rem 0.8rem;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  #board-lanes {
    flex: 1;
    display: flex;
    gap: 0.75rem;
    padding: 0.75rem 1.25rem;
    overflow-x: auto;
    overflow-y: hidden;
  }
  .board-lane {
    flex: 0 0 260px;
    display: flex;
    flex-direction: column;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .board-lane.drag-over { border-color: var(--accent); }
  .board-lane-header {
    padding: 0.5rem 0.75rem;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
  }
  .board-lane-count { color: var(--text-dim); font-weight: 400; }
  .board-lane-cards {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .board-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.5rem 0.6rem;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .board-card:hover { border-color: var(--accent); }
  .board-card.dragging-source { opacity: 0.4; }
  .board-card-ghost { opacity: 0.9; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  .board-card-title { font-weight: 600; word-break: break-word; }
  .board-card-question {
    margin-top: 0.3rem;
    font-size: 0.72rem;
    color: var(--blocked);
  }
  .board-card-lastrun {
    margin-top: 0.3rem;
    font-size: 0.7rem;
    color: var(--text-dim);
  }
  .board-card-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
    margin-top: 0.35rem;
  }
  .board-chip {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.05rem 0.5rem;
    font-size: 0.68rem;
    color: var(--text-secondary);
  }
  .board-chip-assignee { color: var(--accent); border-color: var(--accent); }
  .board-chip-host { color: var(--claimed); border-color: var(--claimed); }
  #board-connection-state { margin-left: 0.5rem; color: var(--text-dim); font-size: 0.75rem; }

  .board-drawer-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 90;
    display: flex;
    justify-content: flex-end;
  }
  .board-drawer-backdrop[hidden] { display: none; }
  .board-drawer {
    width: min(440px, 92vw);
    height: 100vh;
    background: var(--bg-secondary);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 1rem;
  }
  .drawer-header { position: relative; margin-bottom: 0.75rem; }
  .drawer-title {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text-primary);
    font-size: 1rem;
    font-weight: 600;
    padding: 0.2rem 1.75rem 0.2rem 0;
  }
  .drawer-title:focus { outline: 1px solid var(--accent); border-radius: 4px; }
  .drawer-label {
    display: block;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin: 0.6rem 0 0.25rem;
  }
  .drawer-notes, .drawer-tags, .drawer-context, .drawer-assignee {
    width: 100%;
    background: var(--bg-elev);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.55rem;
    font-family: inherit;
    font-size: 0.8rem;
  }
  .drawer-notes { min-height: 5rem; resize: vertical; }
  .drawer-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
  .drawer-actions { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.75rem; }
  .drawer-action {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: 6px;
    padding: 0.3rem 0.65rem;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .drawer-action:hover { border-color: var(--accent); }
  .drawer-session { margin-top: 0.75rem; border-top: 1px solid var(--border); padding-top: 0.5rem; }
  .drawer-session .panel-header { padding: 0; border: none; }
  .drawer-session .events { max-height: 40vh; padding: 0.5rem 0; }
  .drawer-schedule-hint { color: var(--text-dim); font-size: 0.8rem; margin-top: 0.5rem; }
  .drawer-assignment { margin-top: 0.6rem; }
  .assignment-row { margin: 0.6rem 0; }
  .assignment-label {
    display: block;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin: 0 0 0.25rem;
  }
  .assignment-engine, .assignment-model, .assignment-effort, .assignment-host {
    width: 100%;
    background: var(--bg-elev);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.55rem;
    font-family: inherit;
    font-size: 0.8rem;
  }
  .assignment-ran { color: var(--text-dim); font-size: 0.75rem; margin-top: 0.3rem; }
  .assignment-error { color: var(--failed); font-size: 0.75rem; margin-top: 0.3rem; }
</style>
</head>
<body>
<header>
  <h1><a href="/">LifeOS</a></h1>
  <nav class="header-nav">
    <a href="/chat" class="nav-link">💬 Chat</a>
    <a href="/crm" class="nav-link">👥 CRM</a>
    <a href="/agents" class="nav-link active">🛠️ Agents</a>
  </nav>
  <div class="tabs" id="tabs">
    <button class="tab-btn active" id="tab-btn-board" data-tab="board">Board</button>
    <button class="tab-btn" id="tab-btn-graph" data-tab="graph">Graph</button>
  </div>
  <div class="chips" id="graph-chips" hidden>
    <span class="chip running">running <strong id="chip-running">0</strong></span>
    <span class="chip blocked">blocked <strong id="chip-blocked">0</strong></span>
    <span class="chip">recent <strong id="chip-recent">0</strong></span>
    <span class="chip" title="Claude Code CLI sessions (shown as boxes)">cc <strong id="chip-cc">0</strong></span>
    <span class="chip spend" title="API-billed spend: only LifeOS agent worker sessions (Claude Code CLI uses your subscription, not the API).">API spend <strong id="chip-spend">$0.00</strong></span>
    <span class="chip legend" title="Node shapes: circle = cloud agent (Claude) · diamond = local agent · square = Claude Code CLI">
      <span style="opacity:0.6">●</span> cloud &nbsp;
      <span style="opacity:0.6">◆</span> local &nbsp;
      <span style="opacity:0.6">■</span> cli
    </span>
  </div>
</header>

<!-- Board tab (#850) — the primary /agents view. -->
<div class="tab-view" id="board-view">
  <div class="board-filters" id="board-filters">
    <input type="search" id="board-search" placeholder="Search cards…" autocomplete="off" spellcheck="false" />
    <select id="board-filter-lane" title="Lane">
      <option value="all">all lanes</option>
      <option value="unassigned">Unassigned</option>
      <option value="assigned">Assigned</option>
      <option value="in_progress">In progress</option>
      <option value="human_queue">Human queue</option>
      <option value="scheduled">Scheduled</option>
      <option value="review">Review</option>
      <option value="done">Done</option>
    </select>
    <select id="board-filter-assignee" title="Assignee">
      <option value="all">any assignee</option>
      <option value="unassigned">unassigned</option>
      <option value="me">me</option>
      <option value="claude">claude</option>
      <option value="codex">codex</option>
      <option value="hermes">hermes</option>
      <option value="local">local</option>
    </select>
    <select id="board-filter-host" title="Host"><option value="all">all hosts</option></select>
    <input type="text" id="board-filter-tag" placeholder="tag" />
    <select id="board-filter-context" title="Context"><option value="all">all contexts</option></select>
    <select id="board-filter-recency" title="Recency">
      <option value="all" selected>all time</option>
      <option value="3600">1 h</option>
      <option value="86400">24 h</option>
      <option value="604800">1 wk</option>
    </select>
    <label><input type="checkbox" id="board-filter-done" /> include cancelled</label>
    <button id="board-new-card" type="button">+ New card</button>
    <span id="board-connection-state">connecting…</span>
  </div>
  <div id="board-lanes"></div>
</div>
<div class="board-drawer-backdrop" id="board-drawer-backdrop" hidden>
  <aside class="board-drawer" id="board-drawer"></aside>
</div>

<!-- Graph tab (#850) — the pre-#850 /agents page, unchanged, as a secondary tab. -->
<div class="tab-view" id="graph-view" hidden>
  <div class="filters">
    <div class="search-wrap" id="search-wrap">
      <input type="search" id="search-input" placeholder="Search sessions…" autocomplete="off" spellcheck="false"
             title="Search session names and summaries. Matches in visible nodes rank above filtered-out ones; click a result to highlight it." />
      <div class="search-results" id="search-results" hidden></div>
    </div>
    <label title="Include sessions that already finished — completed, failed, or budget-exceeded. Hidden by default so the graph focuses on what's live right now."><input type="checkbox" id="filter-terminal" /> include finished</label>
    <label title="Hide sessions whose last activity is older than this. Default flips to 1 week when 'include finished' is on; 30min otherwise.">recency
      <select id="filter-recency">
        <option value="60">1 min</option>
        <option value="1800" selected>30 min</option>
        <option value="86400">24 h</option>
        <option value="604800">1 wk</option>
        <option value="all">all time</option>
      </select>
    </label>
    <label title="Limit to sessions whose project working directory matches.">cwd
      <select id="filter-cwd">
        <option value="all">all</option>
      </select>
    </label>
    <label title="Limit to sessions running on a specific machine.">host
      <select id="filter-host">
        <option value="all">all</option>
      </select>
    </label>
    <label>route
      <select id="filter-route">
        <option value="all">all</option>
        <option value="local">local</option>
        <option value="remote">remote</option>
        <option value="claude">claude</option>
        <option value="claude_code">claude code</option>
        <option value="codex">codex</option>
      </select>
    </label>
    <label>status
      <select id="filter-status">
        <option value="all">all</option>
        <option value="running">running</option>
        <option value="claimed">claimed</option>
        <option value="yielded">yielded</option>
        <option value="inactive">inactive</option>
        <option value="idle">idle</option>
        <option value="blocked">blocked</option>
        <option value="completed">completed</option>
        <option value="ended">ended</option>
        <option value="failed">failed</option>
      </select>
    </label>
    <span style="margin-left:auto;color:var(--text-dim);font-size:0.75rem" id="connection-state">connecting…</span>
  </div>
  <main>
    <section id="graph">
      <svg id="graph-svg" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="empty-state" id="empty-state">
        <div class="icon">🛠️</div>
        <div class="label">No agent sessions yet</div>
        <div class="hint">Sessions will appear here when an <code>#agent</code> task is claimed.</div>
      </div>
    </section>
    <aside class="panel" id="panel-outer">
      <div class="panel-resizer" id="panel-resizer" title="Drag to resize"></div>
      <div class="panel-content" id="panel">
        <div class="panel-empty" id="panel-empty">Click a node to inspect its transcript.</div>
      </div>
    </aside>
  </main>
</div>

<script type="module">
  import { initBoard } from '/static/agents/board.js';
  import { initGraph } from '/static/agents/graph.js';

  const boardView = document.getElementById('board-view');
  const graphView = document.getElementById('graph-view');
  const graphChips = document.getElementById('graph-chips');
  const tabButtons = document.querySelectorAll('.tab-btn');
  let graphInitialized = false;

  function activateTab(name) {
    tabButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.tab === name));
    boardView.hidden = name !== 'board';
    graphView.hidden = name !== 'graph';
    graphChips.hidden = name !== 'graph';
    if (name === 'graph' && !graphInitialized) {
      graphInitialized = true;
      initGraph();
    }
  }

  tabButtons.forEach(btn => btn.addEventListener('click', () => activateTab(btn.dataset.tab)));

  // Board is the primary view — boots immediately. The Graph tab's snapshot
  // fetch + SSE stream only start once the operator opens it.
  initBoard();
</script>
</body>
</html>
