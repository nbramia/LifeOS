<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agents · LifeOS</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-primary: #0a0a0f;
    --bg-secondary: #12121a;
    --bg-card: #1a1a24;
    --bg-elev: #20202c;
    --text-primary: #e8e8ed;
    --text-secondary: #8888a0;
    --text-dim: #5a5a6e;
    --accent: #6366f1;
    --border: #2a2a3a;
    --running: #34d399;
    --running-glow: rgba(52, 211, 153, 0.45);
    --claimed: #60a5fa;
    --yielded: #fbbf24;
    --blocked: #fb923c;
    --completed: #6b7280;
    --failed: #f87171;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.75rem 1.25rem;
    border-bottom: 1px solid var(--border);
    background: var(--bg-secondary);
    height: 56px;
  }
  header h1 {
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  header h1 a {
    color: var(--text-primary);
    text-decoration: none;
  }
  header h1 .crumb {
    color: var(--text-dim);
    font-weight: 400;
    margin: 0 0.5rem;
  }
  .header-nav {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    margin-left: 1rem;
  }
  .nav-link {
    display: flex;
    align-items: center;
    gap: 0.375rem;
    padding: 0.375rem 0.75rem;
    border-radius: 6px;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-secondary);
    transition: all 0.2s;
  }
  .nav-link:hover {
    background: var(--bg-card);
    color: var(--text-primary);
  }
  .nav-link.active {
    background: var(--accent);
    color: var(--bg-primary);
  }
  .chips {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-left: auto;
  }
  .chip {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.25rem 0.75rem;
    font-size: 0.75rem;
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .chip strong { color: var(--text-primary); font-weight: 600; margin-right: 0.25rem; }
  .chip.running strong { color: var(--running); }
  .chip.blocked strong { color: var(--blocked); }
  .chip.spend strong { color: var(--accent); }
  .filters {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    padding: 0.5rem 1.25rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.8rem;
    background: var(--bg-primary);
    color: var(--text-secondary);
  }
  .filters label { display: flex; align-items: center; gap: 0.35rem; cursor: pointer; }
  .filters select {
    background: var(--bg-card);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.25rem 0.5rem;
    font-size: 0.8rem;
  }
  main {
    display: grid;
    grid-template-columns: 1fr var(--panel-width, 360px);
    height: calc(100vh - 56px - 41px);
  }
  /* Drag handle on the left edge of the side panel — col-resize cursor,
     pure CSS visual feedback on hover/active. Drag logic in JS persists
     the width to localStorage so it survives reload. */
  .panel-resizer {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 5px;
    cursor: col-resize;
    background: transparent;
    transition: background 0.15s ease;
    z-index: 10;
  }
  .panel-resizer:hover,
  .panel-resizer.dragging {
    background: var(--accent);
  }
  aside.panel { position: relative; }
  .panel-content {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: 100%;
    padding-left: 5px;  /* leave room for the resizer strip */
  }
  #graph {
    background: var(--bg-primary);
    position: relative;
    overflow: hidden;
  }
  #graph .empty-state {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    gap: 0.5rem;
    pointer-events: none;
  }
  #graph .empty-state .icon { font-size: 2.5rem; opacity: 0.5; }
  #graph .empty-state .label { font-size: 0.95rem; }
  #graph .empty-state .hint { font-size: 0.8rem; color: var(--text-dim); }
  aside.panel {
    background: var(--bg-secondary);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    padding: 1rem;
    border-bottom: 1px solid var(--border);
  }
  .panel-header .label {
    font-size: 0.95rem;
    font-weight: 600;
    word-break: break-word;
  }
  .panel-header .meta {
    color: var(--text-secondary);
    font-size: 0.75rem;
    margin-top: 0.25rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 0.75rem;
  }
  .panel-header .meta .badge {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 0.1rem 0.5rem;
    border-radius: 4px;
    font-size: 0.7rem;
  }
  .badge.status-running { color: var(--running); border-color: var(--running); }
  .badge.status-claimed { color: var(--claimed); border-color: var(--claimed); }
  .badge.status-yielded { color: var(--yielded); border-color: var(--yielded); }
  .badge.status-inactive { color: var(--yielded); border-color: var(--yielded); }
  .badge.status-blocked { color: var(--blocked); border-color: var(--blocked); }
  .badge.status-completed { color: var(--completed); border-color: var(--completed); }
  .badge.status-failed,
  .badge.status-budget_exceeded { color: var(--failed); border-color: var(--failed); }
  .panel-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    padding: 2rem;
    text-align: center;
    font-size: 0.85rem;
  }
  .events {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem;
  }
  .event {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.45rem 0.6rem;
    margin-bottom: 0.4rem;
    font-size: 0.78rem;
    line-height: 1.35;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .event.kind-tool_call { border-left: 2px solid var(--accent); }
  .event.kind-failed,
  .event.kind-managed_failed,
  .event.kind-child_failed_internal,
  .event.kind-killed,
  .event.kind-cascade_killed { border-left: 2px solid var(--failed); }
  .event.kind-spawn,
  .event.kind-spawned_child { border-left: 2px solid var(--claimed); }
  .event.kind-final { border-left: 2px solid var(--running); }
  .event .kind {
    color: var(--text-primary);
    font-weight: 600;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 0.72rem;
    cursor: pointer;
    padding: 0.05rem 0.3rem;
    border-radius: 3px;
    transition: background 0.12s ease;
  }
  .event .kind:hover {
    background: var(--bg-elev);
    color: var(--accent);
  }
  .event .kind.kind-active-filter {
    background: var(--accent);
    color: var(--bg-primary);
  }
  .event .ts {
    color: var(--text-dim);
    font-size: 0.68rem;
    margin-left: 0.5rem;
  }
  .event .payload {
    color: var(--text-secondary);
    margin-top: 0.2rem;
    word-break: break-word;
    white-space: pre-wrap;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 0.7rem;
    max-height: 8rem;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* Click anywhere on a feed item (except the kind label, which filters)
     to expand it — full untruncated payload + white text. Click again to
     collapse. The cursor signals affordance only on the content area. */
  .event .payload { cursor: pointer; }
  .event.expanded {
    background: var(--bg-elev);
  }
  .event.expanded .payload {
    color: var(--text-primary);
    max-height: none;
    overflow: visible;
    text-overflow: clip;
  }
  .panel-close {
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 1.25rem;
    line-height: 1;
    padding: 0.15rem 0.4rem;
    border-radius: 4px;
    float: right;
  }
  .panel-close:hover { background: var(--bg-card); color: var(--text-primary); }
  .panel-kill {
    background: var(--bg-card);
    border: 1px solid var(--failed);
    color: var(--failed);
    cursor: pointer;
    font-size: 0.75rem;
    line-height: 1;
    padding: 0.3rem 0.55rem;
    border-radius: 4px;
    float: right;
    margin-right: 0.5rem;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .panel-kill:hover { background: var(--failed); color: var(--bg-primary); }
  .panel-kill:disabled {
    opacity: 0.6;
    cursor: progress;
  }
  .panel-resume {
    background: var(--bg-card);
    border: 1px solid var(--accent);
    color: var(--accent);
    cursor: pointer;
    font-size: 0.75rem;
    line-height: 1;
    padding: 0.3rem 0.55rem;
    border-radius: 4px;
    float: right;
    margin-right: 0.5rem;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .panel-resume:hover { background: var(--accent); color: var(--bg-primary); }
  .panel-resume:disabled { opacity: 0.6; cursor: progress; }
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
    animation: fadeIn 0.15s ease;
  }
  .modal {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    width: min(420px, 90vw);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal h2 {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 0.6rem;
  }
  .modal .target {
    color: var(--text-secondary);
    font-size: 0.8rem;
    margin-bottom: 0.5rem;
    word-break: break-word;
  }
  .modal .descendants {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.5rem 0.75rem;
    font-size: 0.75rem;
    color: var(--text-secondary);
    margin: 0.5rem 0;
    max-height: 6rem;
    overflow-y: auto;
  }
  .modal textarea {
    width: 100%;
    background: var(--bg-elev);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.6rem;
    font-family: inherit;
    font-size: 0.8rem;
    resize: vertical;
    min-height: 3rem;
    margin: 0.5rem 0;
  }
  .modal .actions {
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
    margin-top: 0.75rem;
  }
  .modal button {
    background: var(--bg-elev);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.85rem;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .modal button.danger {
    background: var(--failed);
    color: var(--bg-primary);
    border-color: var(--failed);
    font-weight: 600;
  }
  .modal button:hover { filter: brightness(1.15); }
  .toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem 1rem;
    font-size: 0.85rem;
    box-shadow: 0 6px 24px rgba(0,0,0,0.4);
    z-index: 110;
    animation: fadeIn 0.2s ease;
  }
  .toast.error { border-color: var(--failed); color: var(--failed); }
  .live-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--running);
    box-shadow: 0 0 6px var(--running-glow);
    margin-right: 0.4rem;
    animation: pulse 1.4s ease-in-out infinite;
    vertical-align: middle;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }
  @media (max-width: 800px) {
    main {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr auto;
    }
    aside.panel {
      max-height: 50vh;
      border-left: none;
      border-top: 1px solid var(--border);
    }
    .chips { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1><a href="/">LifeOS</a></h1>
  <nav class="header-nav">
    <a href="/chat" class="nav-link">💬 Chat</a>
    <a href="/crm" class="nav-link">👥 CRM</a>
    <a href="/agents" class="nav-link active">🛠️ Agents</a>
  </nav>
  <div class="chips" id="chips">
    <span class="chip running">running <strong id="chip-running">0</strong></span>
    <span class="chip blocked">blocked <strong id="chip-blocked">0</strong></span>
    <span class="chip">recent <strong id="chip-recent">0</strong></span>
    <span class="chip" title="Claude Code CLI sessions (shown as boxes)">cc <strong id="chip-cc">0</strong></span>
    <span class="chip spend" title="API-billed spend: only LifeOS agent worker sessions (Claude Code CLI uses your subscription, not the API)">API spend <strong id="chip-spend">$0.00</strong></span>
    <span class="chip legend" title="Node shapes: circle = LifeOS agent worker · square = Claude Code CLI · diamond = Task-tool subagent">
      <span style="opacity:0.6">●</span> agent &nbsp;
      <span style="opacity:0.6">■</span> cli &nbsp;
      <span style="opacity:0.6">◆</span> sub
    </span>
  </div>
</header>
<div class="filters">
  <label title="Include sessions that already finished — completed, failed, or budget-exceeded. Hidden by default so the graph focuses on what's live right now."><input type="checkbox" id="filter-terminal" /> include finished</label>
  <label title="Hide sessions whose last activity is older than this. Default flips to 1 week when 'include finished' is on; 30min otherwise.">recency
    <select id="filter-recency">
      <option value="60">1 min</option>
      <option value="1800" selected>30 min</option>
      <option value="86400">24 h</option>
      <option value="604800">1 wk</option>
      <option value="all">all time</option>
    </select>
  </label>
  <label title="Limit to sessions whose project working directory matches.">cwd
    <select id="filter-cwd">
      <option value="all">all</option>
    </select>
  </label>
  <label>route
    <select id="filter-route">
      <option value="all">all</option>
      <option value="local">local</option>
      <option value="claude">claude</option>
      <option value="claude_code">claude code</option>
    </select>
  </label>
  <label>status
    <select id="filter-status">
      <option value="all">all</option>
      <option value="running">running</option>
      <option value="claimed">claimed</option>
      <option value="yielded">yielded</option>
      <option value="inactive">inactive</option>
      <option value="blocked">blocked</option>
      <option value="completed">completed</option>
      <option value="failed">failed</option>
    </select>
  </label>
  <span style="margin-left:auto;color:var(--text-dim);font-size:0.75rem" id="connection-state">connecting…</span>
</div>
<main>
  <section id="graph">
    <div class="empty-state" id="empty-state">
      <div class="icon">🛠️</div>
      <div class="label">No agent sessions yet</div>
      <div class="hint">Sessions will appear here when an <code>#agent</code> task is claimed.</div>
    </div>
  </section>
  <aside class="panel" id="panel-outer">
    <div class="panel-resizer" id="panel-resizer" title="Drag to resize"></div>
    <div class="panel-content" id="panel">
      <div class="panel-empty" id="panel-empty">Click a node to inspect its transcript.</div>
    </div>
  </aside>
</main>

<script>
(() => {
  const STATUS_COLORS = {
    running:   '#34d399',
    claimed:   '#60a5fa',
    yielded:   '#fbbf24',  // agent worker — paused waiting on children
    inactive:  '#fbbf24',  // claude code — paused, resumable
    blocked:   '#fb923c',
    completed: '#6b7280',
    failed:    '#f87171',
    budget_exceeded: '#f87171',
  };
  const TERMINAL = new Set(['completed', 'failed', 'budget_exceeded']);

  const filterTerminalEl = document.getElementById('filter-terminal');
  const filterRouteEl = document.getElementById('filter-route');
  const filterStatusEl = document.getElementById('filter-status');
  const filterRecencyEl = document.getElementById('filter-recency');
  const filterCwdEl = document.getElementById('filter-cwd');
  const connStateEl = document.getElementById('connection-state');
  const emptyStateEl = document.getElementById('empty-state');
  const panelEl = document.getElementById('panel');
  const panelOuterEl = document.getElementById('panel-outer');
  const panelResizerEl = document.getElementById('panel-resizer');
  // Operator chooses recency manually → don't auto-flip on include-finished toggle.
  let recencyManuallySet = false;

  let allSessions = [];
  let allEdges = [];
  let selectedSessionId = null;
  let transcriptES = null;

  const graphEl = document.getElementById('graph');
  const nodes = new vis.DataSet([]);
  const edges = new vis.DataSet([]);
  const network = new vis.Network(graphEl, { nodes, edges }, {
    physics: {
      // forceAtlas2Based gives the same airy, repulsion-dominant layout the
      // /crm graph has — clusters form from charge, not link length. Strong
      // gravitationalConstant + avoidOverlap keep nodes from stacking even
      // when token-based sizing makes some of them big.
      enabled: true,
      stabilization: { iterations: 250, fit: true },
      solver: 'forceAtlas2Based',
      forceAtlas2Based: {
        gravitationalConstant: -90,
        centralGravity: 0.008,
        springLength: 150,
        springConstant: 0.05,
        damping: 0.6,
        avoidOverlap: 0.7,
      },
      maxVelocity: 50,
      minVelocity: 0.5,
      timestep: 0.4,
    },
    interaction: { hover: true, tooltipDelay: 200, dragNodes: true },
    edges: {
      arrows: { to: { enabled: true, scaleFactor: 0.6 } },
      color: { color: '#3a3a4a', highlight: '#6366f1' },
      width: 1.5,
      smooth: { type: 'cubicBezier', forceDirection: 'vertical', roundness: 0.45 },
    },
    nodes: {
      shape: 'dot',
      size: 18,
      borderWidth: 2,
      color: { background: '#1a1a24', border: '#2a2a3a' },
      font: { color: '#e8e8ed', size: 13, face: 'system-ui', strokeWidth: 0 },
    },
  });

  // Settle physics shortly after initial layout so subsequent updates don't
  // re-stabilize the whole graph on every snapshot tick.
  network.once('stabilizationIterationsDone', () => {
    network.setOptions({ physics: { enabled: false } });
  });

  // Pulse the border of actively-writing nodes (recent activity in last 60s).
  // Toggles borderWidth between a thin and thick value every ~700ms — pure
  // DataSet.update on the targeted IDs so the rest of the canvas doesn't
  // re-render.
  let pulsePhase = 0;
  setInterval(() => {
    if (activelyWritingIds.size === 0) return;
    pulsePhase = (pulsePhase + 1) % 2;
    const next = pulsePhase === 0 ? 2 : 5;
    const updates = [];
    activelyWritingIds.forEach(id => updates.push({ id, borderWidth: next }));
    if (updates.length) {
      try { nodes.update(updates); } catch (_) {}
    }
  }, 700);

  network.on('click', (params) => {
    if (params.nodes && params.nodes.length > 0) {
      openPanel(params.nodes[0]);
    }
  });

  // Strip the user's home directory prefix for display.
  // /home/nathanramia/Code/LifeOS → /Code/LifeOS
  function shortenCwd(p) {
    if (!p) return p;
    const m = p.match(/^\/(home|Users)\/[^/]+(\/.*)?$/);
    if (m) return m[2] || '/';
    return p;
  }

  // Re-populate the cwd dropdown with unique decoded_cwd values from the
  // snapshot. Preserves operator selection if the chosen cwd still exists.
  let _lastCwdOptionKey = '';
  function updateCwdOptions(sessions) {
    if (!filterCwdEl) return;
    const cwds = [...new Set(sessions.map(s => s.decoded_cwd).filter(Boolean))].sort();
    const key = cwds.join('|');
    if (key === _lastCwdOptionKey) return;
    _lastCwdOptionKey = key;
    const current = filterCwdEl.value;
    filterCwdEl.innerHTML = '<option value="all">all</option>'
      + cwds.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(shortenCwd(c))}</option>`).join('');
    if (current && (current === 'all' || cwds.includes(current))) {
      filterCwdEl.value = current;
    }
    const wrap = filterCwdEl.closest('label');
    if (wrap) wrap.style.display = cwds.length > 0 ? '' : 'none';
  }

  function applyFilters(sessions) {
    const showTerm = filterTerminalEl.checked;
    const route = filterRouteEl.value;
    const status = filterStatusEl.value;
    const recencyRaw = filterRecencyEl ? filterRecencyEl.value : 'all';
    const recencySec = (recencyRaw === 'all') ? null : Number(recencyRaw);
    const cwdSel = filterCwdEl ? filterCwdEl.value : 'all';
    const nowSec = Date.now() / 1000;
    return sessions.filter(s => {
      if (!showTerm && TERMINAL.has(s.status)) return false;
      if (recencySec !== null && s.last_activity_at
          && (nowSec - s.last_activity_at) > recencySec) {
        return false;
      }
      if (cwdSel !== 'all' && s.decoded_cwd !== cwdSel) return false;
      if (route !== 'all') {
        const r = s.routing || 'local';
        if (r !== route) return false;
      }
      if (status !== 'all' && s.status !== status) return false;
      return true;
    });
  }

  function applyRecencyDefault() {
    if (recencyManuallySet || !filterRecencyEl) return;
    filterRecencyEl.value = filterTerminalEl.checked ? '604800' : '1800';
  }
  applyRecencyDefault();

  function routingLabel(routing) {
    if (!routing || routing === 'local') return 'Local';
    if (routing === 'claude_code') return 'Claude Code';
    return 'Claude';
  }

  // Hex helper — lighten/darken/transparentize a color for terminal nodes
  // so completed/failed sessions read as "done" without losing their status hue.
  function hexWithAlpha(hex, alpha) {
    const h = hex.replace('#', '');
    const r = parseInt(h.slice(0, 2), 16);
    const g = parseInt(h.slice(2, 4), 16);
    const b = parseInt(h.slice(4, 6), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  // Token-based sizing. Log scale so a 100k-token session is roughly 2x the
  // size of a 1k-token session — not 100x. Capped at 56 so the canvas
  // doesn't get dominated by one fat node.
  function sizeForTokens(totalTokens) {
    const t = Math.max(0, totalTokens || 0);
    const grown = Math.log10(t + 10) * 6; // log10(10)=1 → +6; log10(100k)≈5 → +30
    return Math.min(56, Math.max(14, 14 + grown));
  }

  // Tracks the IDs of nodes currently considered 'actively writing' — fresh
  // activity in the last 60s. We pulse their border via a setInterval to
  // separate them visually from a session that's running-but-quiet within
  // the broader 10-min running window.
  const activelyWritingIds = new Set();

  function nodeFor(s) {
    const color = STATUS_COLORS[s.status] || '#6b7280';
    const isTerminal = TERMINAL.has(s.status);
    const isBlocked = s.status === 'blocked';
    const isInferred = !!s.status_inferred;
    const isClaudeCode = (s.source === 'claude_code');
    const isSubagent = !!s.is_subagent;
    // Recent-activity window: a node that was touched in the last 60s
    // earns a pulsing border. Running-but-quiet nodes (within 10min but
    // outside 60s) still read as `running` but don't blink.
    const nowSec = Date.now() / 1000;
    const isActivelyWriting = s.status === 'running'
      && s.last_activity_at
      && (nowSec - s.last_activity_at) < 60;
    if (isActivelyWriting) activelyWritingIds.add(s.session_id);
    else activelyWritingIds.delete(s.session_id);
    const totalTokens = (s.total_input_tokens || 0) + (s.total_output_tokens || 0);
    const size = sizeForTokens(totalTokens);
    const fill = isTerminal ? hexWithAlpha(color, 0.35) : hexWithAlpha(color, 0.85);
    const border = color;
    // Source distinction by shape:
    //   - LifeOS agent worker sessions → `dot` (circle)
    //   - Claude Code terminal sessions → `box` (rounded square)
    //   - Claude Code Task-tool subagent nodes → `diamond`
    // Status color + token-based size still apply across all shapes.
    const shape = isSubagent ? 'diamond' : (isClaudeCode ? 'box' : 'dot');
    // Box-shape nodes use `widthConstraint` for sizing rather than radius;
    // map our log-token size into a width/height to keep visual parity.
    const boxSide = Math.max(size * 1.8, 36);
    // Prefer the model label; when the parser couldn't find a model in the
    // transcript, show "?" for CC sessions instead of the longer fallback so
    // it reads as "model unknown" at a glance. The routing badge in the side
    // panel still says "Claude Code" so context isn't lost.
    let label = s.model_label || routingLabel(s.routing) || s.session_id.slice(0, 8);
    if (isClaudeCode && label === 'Claude Code') label = '?';
    return {
      id: s.session_id,
      label: label,
      title: [
        s.label,
        s.decoded_cwd ? `cwd: ${s.decoded_cwd}` : null,
        `source: ${isClaudeCode ? 'Claude Code CLI' : 'LifeOS agent'}`,
        `status: ${s.status}${isInferred ? ' (inferred)' : ''}`,
        `routing: ${routingLabel(s.routing)}`,
        `tokens: ${s.total_input_tokens} in / ${s.total_output_tokens} out`,
        `cost: $${(s.total_dollars || 0).toFixed(4)}`,
        `active: ${(s.total_active_seconds || 0).toFixed(1)}s`,
        s.last_event_kind ? `last: ${s.last_event_kind}` : null,
      ].filter(Boolean).join('\n'),
      shape: shape,
      color: {
        background: fill,
        border: border,
        highlight: { background: color, border: '#e8e8ed' },
      },
      size: size,
      widthConstraint: shape === 'box' ? { minimum: boxSide, maximum: boxSide * 2 } : undefined,
      heightConstraint: shape === 'box' ? { minimum: boxSide * 0.55 } : undefined,
      margin: shape === 'box' ? 10 : undefined,
      borderWidth: isBlocked ? 4 : 2,
      borderWidthSelected: isBlocked ? 4 : 3,
      // Dashed border signals an inferred status (Claude Code only today).
      shapeProperties: isInferred ? { borderDashes: [4, 3] } : { borderDashes: false },
      shadow: !isTerminal ? { enabled: true, color: hexWithAlpha(color, 0.45), size: 14, x: 0, y: 0 } : false,
      font: { color: '#e8e8ed' },
    };
  }

  // Incremental DataSet update. Avoids vis-network re-stabilizing the
  // entire physics simulation every 2s — nodes stay put, only the attrs
  // (color/size/title) tick.
  function renderGraph(sessions, snapshotEdges) {
    const visible = applyFilters(sessions);
    const visibleIds = new Set(visible.map(s => s.session_id));

    const nextNodesById = new Map(visible.map(s => [s.session_id, nodeFor(s)]));
    const existingNodeIds = new Set(nodes.getIds());
    const toRemove = [...existingNodeIds].filter(id => !nextNodesById.has(id));
    if (toRemove.length) nodes.remove(toRemove);
    nodes.update([...nextNodesById.values()]);

    const nextEdgesById = new Map();
    for (const e of snapshotEdges) {
      if (!visibleIds.has(e.from) || !visibleIds.has(e.to)) continue;
      const id = `${e.from}->${e.to}`;
      nextEdgesById.set(id, { id, from: e.from, to: e.to });
    }
    const existingEdgeIds = new Set(edges.getIds());
    const edgesToRemove = [...existingEdgeIds].filter(id => !nextEdgesById.has(id));
    if (edgesToRemove.length) edges.remove(edgesToRemove);
    edges.update([...nextEdgesById.values()]);

    emptyStateEl.style.display = visible.length === 0 ? '' : 'none';
    // Chips and cwd dropdown reflect what's actually on screen. Earlier this
    // passed the unfiltered `sessions` which left API spend pegged regardless
    // of include-finished etc. (see issue #174).
    updateChips(visible);
    updateCwdOptions(allSessions);
  }

  function updateChips(sessions) {
    const running = sessions.filter(s => s.status === 'running').length;
    const blocked = sessions.filter(s => s.status === 'blocked').length;
    const recent = sessions.filter(s => s.status === 'completed').length;
    const cc = sessions.filter(s => s.source === 'claude_code').length;
    // API spend = LifeOS agent worker sessions only. Claude Code CLI is paid
    // via the user's subscription, not metered API tokens, so its dollar
    // numbers would distort what the chip is meant to surface (real cost).
    const apiSpend = sessions
      .filter(s => s.source !== 'claude_code')
      .reduce((acc, s) => acc + (s.total_dollars || 0), 0);
    document.getElementById('chip-running').textContent = running;
    document.getElementById('chip-blocked').textContent = blocked;
    document.getElementById('chip-recent').textContent = recent;
    document.getElementById('chip-cc').textContent = cc;
    document.getElementById('chip-spend').textContent = '$' + apiSpend.toFixed(2);
  }

  function applySnapshot(snap) {
    allSessions = snap.sessions || [];
    allEdges = snap.edges || [];
    renderGraph(allSessions, allEdges);
    // Update the panel meta in place if the selected session is still around.
    // Replacing innerHTML on every tick would wipe the events container and
    // detach the live SSE renderer — the previous bug where the side panel
    // blinked into view and then went blank.
    if (selectedSessionId) {
      const s = allSessions.find(x => x.session_id === selectedSessionId);
      if (s) updatePanelMeta(s);
    }
  }

  // --- Side panel ---
  // Build the panel scaffold once per session selection. Subsequent snapshot
  // ticks call updatePanelMeta() which only touches data-attributed spans —
  // never the events container. This is what fixes the "click → blink → blank"
  // bug where the SSE event list was getting destroyed every 2s.
  function renderPanelHeader(s) {
    const live = !TERMINAL.has(s.status);
    const safeStatus = escapeAttr(s.status);
    const isClaudeCode = (s.source === 'claude_code');
    const isSubagent = !!s.is_subagent;
    // No kill button for Claude Code sessions — we don't have a safe primitive
    // to terminate them from outside the terminal.
    const showKill = live && !isClaudeCode;
    // Resume button: only for terminal-state Claude Code sessions (not subagents).
    // Whether the backend will actually accept the click depends on
    // LIFEOS_CC_RESUME_ENABLED on the server; if disabled, click → toast error.
    const showResume = isClaudeCode && !isSubagent && (TERMINAL.has(s.status) || s.status === 'inactive' || s.status === 'yielded');
    const sourceLabel = isClaudeCode ? 'Claude Code' : 'LifeOS agent';
    const inferredHint = s.status_inferred ? ' (inferred)' : '';
    panelEl.innerHTML = `
      <div class="panel-header">
        <button class="panel-close" aria-label="Close" id="panel-close">×</button>
        ${showKill ? '<button class="panel-kill" id="panel-kill">Kill</button>' : ''}
        ${showResume ? '<button class="panel-resume" id="panel-resume" title="Open a terminal and resume this session">Resume</button>' : ''}
        <div class="label" data-field="label">${escapeHtml(s.label || s.session_id)}</div>
        <div class="cwd-hint" data-field="cwd-hint" style="font-size:0.7rem;color:var(--text-dim);margin-top:0.15rem;word-break:break-all">${s.decoded_cwd ? escapeHtml(s.decoded_cwd) : ''}</div>
        <div class="meta" data-field="meta">
          <span data-field="live-dot">${live ? '<span class="live-dot" title="live"></span>' : ''}</span>
          <span class="badge status-${safeStatus}" data-field="status">${escapeHtml(s.status + inferredHint)}</span>
          <span class="badge" data-field="source">${escapeHtml(sourceLabel)}</span>
          <span class="badge" data-field="routing">${escapeHtml(routingLabel(s.routing))}</span>
          <span class="badge" data-field="cost">$${(s.total_dollars || 0).toFixed(4)}</span>
          <span class="badge" data-field="tokens">${s.total_input_tokens}↓ / ${s.total_output_tokens}↑</span>
          <span data-field="depth">${s.spawn_depth ? `<span class="badge">depth ${s.spawn_depth}</span>` : ''}</span>
        </div>
      </div>
      <div class="events" id="events"></div>
    `;
    document.getElementById('panel-close').onclick = closePanel;
    if (showKill) {
      document.getElementById('panel-kill').onclick = () => openKillModal(s);
    }
    if (showResume) {
      document.getElementById('panel-resume').onclick = () => resumeCcSession(s);
    }
  }

  async function resumeCcSession(s) {
    const btn = document.getElementById('panel-resume');
    if (btn) {
      btn.disabled = true;
      btn.textContent = 'Resuming…';
    }
    try {
      const r = await fetch(`/api/agents/sessions/${encodeURIComponent(s.session_id)}/resume`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({}),
      });
      if (!r.ok) {
        const text = await r.text();
        // FastAPI returns {"detail": "..."} on HTTPException — surface that.
        let msg = text;
        try { const j = JSON.parse(text); msg = j.detail || msg; } catch (_) {}
        throw new Error(`HTTP ${r.status}: ${msg}`);
      }
      const result = await r.json();
      // The server tries to push `inner_command` to the system clipboard
      // via wl-copy / xclip — that's far more reliable than the browser
      // Clipboard API, which silently fails when the page loses focus
      // (which happens the instant Warp opens). If the server copy
      // didn't land, try one more time from the browser before showing
      // the command inline so the operator can copy it manually.
      let copied = !!result.clipboard_copied;
      if (!copied && result.inner_command && navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(result.inner_command);
          copied = true;
        } catch (_) {
          // ignore — toast will show the command for manual copy
        }
      }
      if (copied) {
        showToast(`Warp opened. Resume command copied to clipboard — paste it.`, false);
      } else if (result.inner_command) {
        showToast(`Warp opened. Run: ${result.inner_command}`, false);
      } else {
        showToast(`Spawned (pid ${result.pid}) in ${result.cwd}`, false);
      }
    } catch (err) {
      showToast(`Resume failed: ${err.message}`, true);
    } finally {
      // Re-enable after a beat so accidental double-click is harmless.
      setTimeout(() => {
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Resume';
        }
      }, 4000);
    }
  }

  // In-place metadata refresh — keeps the events container intact across
  // snapshot ticks. Only updates fields by their data-field selectors.
  function updatePanelMeta(s) {
    if (!panelEl) return;
    const setText = (sel, text) => {
      const el = panelEl.querySelector(`[data-field="${sel}"]`);
      if (el) el.textContent = text;
    };
    const setHtml = (sel, html) => {
      const el = panelEl.querySelector(`[data-field="${sel}"]`);
      if (el) el.innerHTML = html;
    };
    const inferredHint = s.status_inferred ? ' (inferred)' : '';
    const isClaudeCode = (s.source === 'claude_code');
    const sourceLabel = isClaudeCode ? 'Claude Code' : 'LifeOS agent';
    setText('label', s.label || s.session_id);
    setText('status', s.status + inferredHint);
    setText('source', sourceLabel);
    setText('routing', routingLabel(s.routing));
    setText('cost', '$' + (s.total_dollars || 0).toFixed(4));
    setText('tokens', `${s.total_input_tokens}↓ / ${s.total_output_tokens}↑`);
    setText('cwd-hint', s.decoded_cwd || '');

    // Status changed → swap the badge class so the color follows.
    const statusBadge = panelEl.querySelector('[data-field="status"]');
    if (statusBadge) {
      statusBadge.className = `badge status-${escapeAttr(s.status)}`;
    }

    // Live dot + kill button visibility track terminal state.
    const live = !TERMINAL.has(s.status);
    setHtml('live-dot', live ? '<span class="live-dot" title="live"></span>' : '');
    setHtml('depth', s.spawn_depth ? `<span class="badge">depth ${s.spawn_depth}</span>` : '');

    const killBtn = document.getElementById('panel-kill');
    if (live && !killBtn) {
      // Add the kill button if the session just transitioned to non-terminal
      // (rare; usually the other direction).
      const header = panelEl.querySelector('.panel-header');
      if (header) {
        const closeBtn = header.querySelector('#panel-close');
        const btn = document.createElement('button');
        btn.className = 'panel-kill';
        btn.id = 'panel-kill';
        btn.textContent = 'Kill';
        btn.onclick = () => openKillModal(s);
        header.insertBefore(btn, closeBtn);
      }
    } else if (!live && killBtn) {
      killBtn.remove();
    }
  }

  function openKillModal(session) {
    // BFS down parent_session_id so non-root targets only show *their* subtree,
    // matching the backend cascade scope. (Filtering by root_session_id would
    // wrongly include unrelated peers under the same root.)
    const childrenOf = new Map();
    for (const x of allSessions) {
      if (!x.parent_session_id) continue;
      if (!childrenOf.has(x.parent_session_id)) childrenOf.set(x.parent_session_id, []);
      childrenOf.get(x.parent_session_id).push(x);
    }
    const descendants = [];
    const queue = [session.session_id];
    const seen = new Set([session.session_id]);
    while (queue.length) {
      const sid = queue.shift();
      for (const child of (childrenOf.get(sid) || [])) {
        if (seen.has(child.session_id)) continue;
        seen.add(child.session_id);
        if (!TERMINAL.has(child.status)) descendants.push(child);
        queue.push(child.session_id);
      }
    }
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal" role="dialog" aria-labelledby="kill-title">
        <h2 id="kill-title">Kill agent session?</h2>
        <div class="target">${escapeHtml(session.label || session.session_id)}</div>
        ${descendants.length > 0 ? `
          <div class="descendants">
            Will also kill ${descendants.length} descendant${descendants.length === 1 ? '' : 's'}:
            ${descendants.slice(0, 5).map(d =>
              `<div>• ${escapeHtml(d.label || d.session_id)}</div>`
            ).join('')}
            ${descendants.length > 5 ? `<div>…and ${descendants.length - 5} more</div>` : ''}
          </div>
        ` : ''}
        <label style="font-size:0.75rem;color:var(--text-secondary)">Reason (optional)</label>
        <textarea id="kill-reason" placeholder="Why are you killing this?"></textarea>
        <div class="actions">
          <button id="kill-cancel">Cancel</button>
          <button class="danger" id="kill-confirm">Kill</button>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);
    const cleanup = () => { if (backdrop.parentNode) backdrop.parentNode.removeChild(backdrop); };
    backdrop.addEventListener('click', e => { if (e.target === backdrop) cleanup(); });
    document.getElementById('kill-cancel').onclick = cleanup;
    document.getElementById('kill-confirm').onclick = async () => {
      const reason = document.getElementById('kill-reason').value || '';
      const confirmBtn = document.getElementById('kill-confirm');
      confirmBtn.disabled = true;
      confirmBtn.textContent = 'Killing…';
      try {
        const r = await fetch(`/api/agents/sessions/${encodeURIComponent(session.session_id)}/kill`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reason }),
        });
        if (!r.ok) {
          const text = await r.text();
          throw new Error(`HTTP ${r.status}: ${text}`);
        }
        const result = await r.json();
        const failures = result.failures || [];
        const killed = result.killed || [];
        if (killed.length === 0 && result.reason) {
          showToast(`Already ${result.reason}`, false);
        } else if (failures.length === 0) {
          showToast(`Killed ${killed.length} session${killed.length === 1 ? '' : 's'}`, false);
        } else {
          showToast(`Killed ${killed.length}; ${failures.length} remote failure(s)`, true);
        }
        cleanup();
      } catch (err) {
        showToast(`Kill failed: ${err.message}`, true);
        confirmBtn.disabled = false;
        confirmBtn.textContent = 'Kill';
      }
    };
  }

  function showToast(message, isError) {
    const t = document.createElement('div');
    t.className = 'toast' + (isError ? ' error' : '');
    t.textContent = message;
    document.body.appendChild(t);
    setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 3500);
  }

  function closePanel() {
    selectedSessionId = null;
    eventKindFilter = null;
    if (transcriptES) { transcriptES.close(); transcriptES = null; }
    panelEl.innerHTML = '<div class="panel-empty" id="panel-empty">Click a node to inspect its transcript.</div>';
  }

  function openPanel(sessionId) {
    if (transcriptES) { transcriptES.close(); transcriptES = null; }
    // Reset filter when switching sessions — kinds are session-scoped.
    eventKindFilter = null;
    selectedSessionId = sessionId;
    const s = allSessions.find(x => x.session_id === sessionId);
    if (!s) return;
    renderPanelHeader(s);

    // Backfill then live tail.
    fetch(`/api/agents/sessions/${encodeURIComponent(sessionId)}/events?limit=200`)
      .then(r => r.json())
      .then(payload => {
        const events = payload.events || [];
        // Default kind-filter to user_message when any exist — most of the
        // time the operator just wants to skim the user prompts. If there
        // are none (e.g. a freshly-spawned subagent), no filter is applied.
        if (events.some(ev => (ev.kind || '') === 'user_message')) {
          eventKindFilter = 'user_message';
        }
        events.forEach(ev => appendEvent(ev, false));
        applyEventFilter();
        // Now open live SSE.
        const es = new EventSource(`/api/agents/sessions/${encodeURIComponent(sessionId)}/stream?backfill=0`);
        transcriptES = es;
        es.addEventListener('transcript_event', e => {
          try { appendEvent(JSON.parse(e.data), true); } catch (_) {}
        });
        es.addEventListener('closed', () => { es.close(); });
        es.onerror = () => {}; // browser auto-retries
      })
      .catch(err => {
        const e = document.getElementById('events');
        if (e) e.innerHTML = `<div class="event">Failed to load events: ${escapeHtml(String(err))}</div>`;
      });
  }

  // Kind filter state for the side-panel feed. null = show all; otherwise
  // only events whose kind matches the filter are visible. Clicking the same
  // kind label twice toggles back to "show all".
  let eventKindFilter = null;

  // Format a unix-epoch timestamp as "MM/DD h:mm:ssa ET" — explicit Eastern
  // tz so it matches the rest of LifeOS (timezone='America/New_York' in
  // settings.py) regardless of the browser machine's locale.
  function formatTs(ts) {
    if (!ts) return '';
    const d = new Date(ts * 1000);
    const date = d.toLocaleDateString('en-US', {
      timeZone: 'America/New_York',
      month: 'numeric',
      day: 'numeric',
    });
    const time = d.toLocaleTimeString('en-US', {
      timeZone: 'America/New_York',
      hour: 'numeric',
      minute: '2-digit',
      second: '2-digit',
      hour12: true,
    });
    return `${date} ${time} ET`;
  }

  // appendEvent always renders newest-on-top so backfill and live additions
  // share the same visual order. Backfill is delivered oldest-first, so we
  // prepend each one as it arrives, leaving the chronologically-newest event
  // at the top by the time live tail begins.
  function appendEvent(ev, _live) {
    const container = document.getElementById('events');
    if (!container) return;
    const kind = String(ev.kind || '');
    const ts = formatTs(ev.ts);
    const payload = ev.payload ? JSON.stringify(ev.payload, null, 0) : '';
    const truncated = payload.length > 240 ? payload.slice(0, 240) + '…' : payload;
    const div = document.createElement('div');
    // classList.add validates token shape — defense-in-depth even though
    // `kind` is server-controlled today.
    div.classList.add('event');
    if (kind) {
      const safeKind = kind.replace(/[^a-zA-Z0-9_-]/g, '_');
      div.classList.add(`kind-${safeKind}`);
      div.dataset.kind = kind;
    }
    div.innerHTML = `
      <div><span class="kind" role="button" tabindex="0" title="Click to filter to this event type">${escapeHtml(kind)}</span><span class="ts">${escapeHtml(ts)}</span></div>
      ${payload ? `<div class="payload" data-full="${escapeHtml(payload)}" title="Click to expand">${escapeHtml(truncated)}</div>` : ''}
    `;
    // Hide the event up front if a filter is active and doesn't match.
    if (eventKindFilter && kind !== eventKindFilter) {
      div.style.display = 'none';
    }
    // Click on the kind label → toggle filter on this kind.
    const kindEl = div.querySelector('.kind');
    if (kindEl && kind) {
      kindEl.addEventListener('click', e => {
        e.stopPropagation();
        toggleKindFilter(kind);
      });
      kindEl.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggleKindFilter(kind);
        }
      });
    }
    // Click anywhere else on the event → toggle expanded (full text + white).
    div.addEventListener('click', e => {
      if (e.target.closest('.kind')) return;  // kind label owns its click
      toggleEventExpanded(div, payload, truncated);
    });
    container.prepend(div);
  }

  function toggleEventExpanded(eventEl, fullText, truncatedText) {
    const payloadEl = eventEl.querySelector('.payload');
    const expanded = eventEl.classList.toggle('expanded');
    if (payloadEl) {
      payloadEl.textContent = expanded ? fullText : truncatedText;
    }
  }

  function toggleKindFilter(kind) {
    eventKindFilter = (eventKindFilter === kind) ? null : kind;
    applyEventFilter();
  }

  function applyEventFilter() {
    const container = document.getElementById('events');
    if (!container) return;
    const events = container.querySelectorAll('.event');
    events.forEach(el => {
      const k = el.dataset.kind;
      if (!eventKindFilter || k === eventKindFilter) {
        el.style.display = '';
      } else {
        el.style.display = 'none';
      }
    });
    // Visually mark filtered state on every visible kind label.
    container.querySelectorAll('.kind').forEach(el => {
      const k = el.parentElement?.parentElement?.dataset?.kind;
      if (eventKindFilter && k === eventKindFilter) {
        el.classList.add('kind-active-filter');
      } else {
        el.classList.remove('kind-active-filter');
      }
    });
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // For values that go into HTML attribute positions via template strings.
  // Restricts to a known-safe charset so attribute-context injection is
  // structurally impossible.
  function escapeAttr(s) {
    return String(s).replace(/[^a-zA-Z0-9_-]/g, '_');
  }

  // --- Filters ---
  filterTerminalEl.addEventListener('change', () => {
    applyRecencyDefault();
    renderGraph(allSessions, allEdges);
  });
  if (filterRecencyEl) {
    filterRecencyEl.addEventListener('change', () => {
      recencyManuallySet = true;
      renderGraph(allSessions, allEdges);
    });
  }
  [filterRouteEl, filterStatusEl, filterCwdEl].filter(Boolean).forEach(el =>
    el.addEventListener('change', () => renderGraph(allSessions, allEdges))
  );

  // --- Side panel resize ---
  // Drag handle on the left edge of aside.panel resizes the panel width.
  // Persists in localStorage so the operator's chosen width survives reload.
  // CSS var `--panel-width` drives the grid layout; updating it shifts the
  // graph column automatically. vis-network is canvas-based and auto-redraws.
  (function setupPanelResizer() {
    if (!panelResizerEl || !panelOuterEl) return;
    const STORAGE_KEY = 'lifeos.agents.panelWidth';
    const MIN_WIDTH = 280;
    const MAX_RATIO = 0.7;
    const setWidth = (px) => {
      const max = Math.floor(window.innerWidth * MAX_RATIO);
      const clamped = Math.max(MIN_WIDTH, Math.min(max, Math.round(px)));
      document.documentElement.style.setProperty('--panel-width', clamped + 'px');
      return clamped;
    };
    // Restore last width if present.
    try {
      const saved = parseInt(localStorage.getItem(STORAGE_KEY) || '', 10);
      if (saved && !isNaN(saved)) setWidth(saved);
    } catch (_) {}

    let dragging = false;
    let startX = 0;
    let startWidth = 0;
    panelResizerEl.addEventListener('mousedown', (e) => {
      dragging = true;
      startX = e.clientX;
      startWidth = panelOuterEl.getBoundingClientRect().width;
      panelResizerEl.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      // Dragging left increases panel width (delta = startX - clientX).
      const newWidth = setWidth(startWidth + (startX - e.clientX));
      // Keep the graph viewport sensibly fit while resizing.
      try { network.redraw(); } catch (_) {}
      // Persist as we drag — release is just a cleanup.
      try { localStorage.setItem(STORAGE_KEY, String(newWidth)); } catch (_) {}
    });
    window.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      panelResizerEl.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      try { network.fit({ animation: { duration: 250, easingFunction: 'easeOutQuad' } }); }
      catch (_) {}
    });
  })();

  // --- Initial load + stream ---
  fetch('/api/agents/snapshot')
    .then(r => r.json())
    .then(applySnapshot)
    .catch(err => { connStateEl.textContent = 'failed: ' + err; });

  const snapshotES = new EventSource('/api/agents/stream');
  snapshotES.onopen = () => { connStateEl.textContent = 'live'; };
  snapshotES.onerror = () => { connStateEl.textContent = 'reconnecting…'; };
  snapshotES.addEventListener('snapshot', e => {
    try { applySnapshot(JSON.parse(e.data)); } catch (_) {}
  });
})();
</script>
</body>
</html>
