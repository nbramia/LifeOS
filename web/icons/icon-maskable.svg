<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed opaque background, same as icon.svg. Android's adaptive
       icon mask can crop to a circle, squircle, or rounded square, so the
       mark below is shrunk and centered to stay inside the ~80%-diameter
       safe zone regardless of which mask shape is applied. -->
  <rect x="0" y="0" width="512" height="512" fill="#1a1a2e"/>
  <g transform="translate(256 256) scale(0.85) translate(-256 -256)">
    <path d="M144 112 L144 368 L368 368" stroke="url(#grad)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="144" cy="112" r="38" fill="#e94560"/>
    <circle cx="368" cy="368" r="38" fill="#ff6b6b"/>
  </g>
</svg>
