<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeOS · Journal Trends</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --text-primary: #e8e8ed;
            --text-secondary: #8888a0;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --border: #2a2a3a;
            --warn: #a855f7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
        }

        .page {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        /* Flags a view that deliberately does not respond to the window
           selector, so a reader never mistakes "didn't move" for "broken". */
        .section-badge {
            display: inline-block;
            font-size: 0.68rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--text-secondary);
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 0.15rem 0.55rem;
            margin-left: 0.5rem;
            vertical-align: middle;
        }

        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: var(--accent-hover);
        }

        .window-selector {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .window-pill {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            border-radius: 999px;
            padding: 0.4rem 1rem;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .window-pill:hover {
            border-color: var(--accent-hover);
            color: var(--text-primary);
        }

        .window-pill.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        section.view {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.25rem 1.5rem;
            margin-bottom: 1.5rem;
        }

        .sample-note {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 0.9rem;
        }

        .sample-note strong {
            color: var(--text-primary);
        }

        .caveat {
            background: var(--bg-secondary);
            border: 1px solid var(--warn);
            border-radius: 10px;
            padding: 0.65rem 0.9rem;
            font-size: 0.85rem;
            margin-bottom: 0.9rem;
            color: var(--text-primary);
        }

        .empty-state {
            color: var(--text-secondary);
            padding: 1.5rem 0;
            font-size: 0.9rem;
        }

        /* -- View A: the strip (GitHub-contribution-style squares; same
           structure/metrics as the CRM heatmap in web/crm.html — weeks as
           flex columns, ~11px square cells, 2px radius/gap — but flat
           discrete emotion colors instead of an intensity ramp: a day
           either has an entry (its primary emotion's color) or it doesn't
           (the empty-cell background). No opacity steps. -- */
        .strip-scroll {
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .strip-months {
            display: flex;
            margin-bottom: 4px;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .strip-month-label {
            text-align: left;
            white-space: nowrap;
            flex: 1;
            min-width: 2em;
        }

        /* --cell is set by JS after measuring available width against the
           full-history span — see MAX_CELL_PX/MIN_CELL_PX in renderStrip.
           Defaults to the max size so a pre-JS/no-JS render still looks
           right for a short history. */
        .strip-grid {
            display: flex;
            gap: 2px;
            width: max-content;
            --cell: 11px;
        }

        .strip-week {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .strip-day {
            width: var(--cell);
            height: var(--cell);
            border-radius: 2px;
            flex-shrink: 0;
        }

        .strip-day.hidden-cell {
            visibility: hidden;
        }

        .strip-day.gap {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
        }

        .strip-day.no-feeling {
            background: var(--bg-secondary);
            border: 1px dashed var(--text-secondary);
        }

        .strip-legend {
            display: flex;
            gap: 1.25rem;
            flex-wrap: wrap;
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 0.6rem;
        }

        .strip-legend-swatch {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            margin-right: 0.35rem;
            vertical-align: middle;
        }

        /* -- View D: scalar stack -- */
        .scalar-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.6rem;
        }

        .scalar-label {
            width: 60px;
            flex-shrink: 0;
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: capitalize;
        }

        .scalar-row svg {
            flex: 1;
            min-width: 0;
            height: 40px;
        }

        /* -- View D: pairwise scatter grid -- */
        .scatter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 0.9rem;
        }

        .scatter-cell {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.7rem 0.8rem;
        }

        .scatter-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .scatter-sentence {
            font-size: 0.8rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            min-height: 2.4em;
        }

        .scatter-chart-row {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .scatter-y-label {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-size: 0.68rem;
            color: var(--text-secondary);
            text-transform: capitalize;
        }

        .scatter-svg {
            flex: 1;
            width: 100%;
            aspect-ratio: 1;
        }

        .scatter-x-label {
            text-align: center;
            font-size: 0.68rem;
            color: var(--text-secondary);
            text-transform: capitalize;
            margin-top: 0.15rem;
        }

        .scatter-footnote {
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-top: 0.4rem;
        }

        .scatter-empty {
            font-size: 0.8rem;
            color: var(--text-secondary);
            padding: 1.5rem 0;
            text-align: center;
        }

        /* -- View B: unexplored wheel -- */
        .wheel-flex {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            align-items: flex-start;
        }

        #taxonomySvg {
            width: 280px;
            height: 280px;
            flex-shrink: 0;
        }

        .taxonomy-legend {
            flex: 1;
            min-width: 220px;
            max-height: 320px;
            overflow-y: auto;
            font-size: 0.82rem;
        }

        .taxonomy-group {
            margin-bottom: 0.6rem;
        }

        .taxonomy-group-header {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
            padding: 0.15rem 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 0.15rem;
        }

        .taxonomy-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.2rem 0 0.2rem 0.5rem;
        }

        .taxonomy-row.unused {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        .taxonomy-swatch {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .taxonomy-count {
            margin-left: auto;
            color: var(--text-secondary);
            font-size: 0.78rem;
        }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <h1>Journal Trends</h1>
            <span>
                <a class="back-link" href="/journal">Emotion wheel</a>
                &nbsp;·&nbsp;
                <a class="back-link" href="/">&larr; Home</a>
            </span>
        </header>

        <div class="window-selector" id="windowSelector">
            <button class="window-pill" data-window="day">Day</button>
            <button class="window-pill" data-window="week">Week</button>
            <button class="window-pill" data-window="month">Month</button>
            <button class="window-pill" data-window="quarter">Quarter</button>
            <button class="window-pill active" data-window="all-time">All-time</button>
        </div>

        <section class="view" id="stripSection">
            <h2>The Strip <span class="section-badge">Full history &mdash; ignores the window selector above</span></h2>
            <div class="sample-note" id="stripNote">Loading…</div>
            <div id="stripBody"></div>
        </section>

        <section class="view" id="scalarSection">
            <h2>Mood · Stress · Sleep · Body</h2>
            <div class="sample-note" id="scalarNote">Loading…</div>
            <div class="caveat" id="correlationNote"></div>
            <div id="scalarBody"></div>
        </section>

        <section class="view" id="taxonomySection">
            <h2>The Unexplored Wheel</h2>
            <div class="sample-note" id="taxonomyNote">Loading…</div>
            <div id="taxonomyBody"></div>
        </section>
    </div>

    <script>
        let currentWindow = 'all-time';

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
            }[c]));
        }

        function fnv1aHue(str) {
            let h = 0x811c9dc5;
            for (let i = 0; i < str.length; i++) {
                h ^= str.toLowerCase().charCodeAt(i);
                h = Math.imul(h, 0x01000193);
            }
            return Math.abs(h) % 360;
        }

        function colorFor(value) {
            return `hsl(${fnv1aHue(value)}, 55%, 55%)`;
        }

        function dayOffset(dateStr, startStr) {
            return Math.round((new Date(dateStr + 'T00:00:00Z') - new Date(startStr + 'T00:00:00Z')) / 86400000);
        }

        function arcPath(cx, cy, rInner, rOuter, a0, a1) {
            if (a1 - a0 >= 2 * Math.PI - 1e-6) a1 = a0 + 2 * Math.PI - 1e-6;
            const toXY = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
            const [x0o, y0o] = toXY(rOuter, a0);
            const [x1o, y1o] = toXY(rOuter, a1);
            const [x0i, y0i] = toXY(rInner, a1);
            const [x1i, y1i] = toXY(rInner, a0);
            const largeArc = (a1 - a0) > Math.PI ? 1 : 0;
            return [
                `M ${x0o} ${y0o}`,
                `A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${x1o} ${y1o}`,
                `L ${x0i} ${y0i}`,
                `A ${rInner} ${rInner} 0 ${largeArc} 0 ${x1i} ${y1i}`,
                'Z',
            ].join(' ');
        }

        async function fetchJson(path) {
            const res = await fetch(path);
            if (!res.ok) throw new Error(`API error: ${res.status}`);
            return res.json();
        }

        // ---- View A: the strip ----

        // Builds one <div class="strip-day"> for a single UTC calendar day,
        // reused by both in-range and out-of-range (hidden) cells so the
        // week/grid loop below stays uncluttered.
        function stripDayCell(d) {
            if (!d) return '<div class="strip-day hidden-cell"></div>';
            let cls = 'strip-day gap';
            let style = '';
            let title = d.date + ': no journal entry';
            if (d.has_entry && d.primary_emotion) {
                cls = 'strip-day';
                style = `background:${colorFor(d.primary_emotion)}`;
                title = `${d.date}: ${d.primary_emotion}`;
            } else if (d.has_entry) {
                cls = 'strip-day no-feeling';
                title = `${d.date}: entry logged, no feeling recorded`;
            }
            return `<div class="${cls}" style="${style}" title="${escapeHtml(title)}"></div>`;
        }

        // Cell size floor/ceiling for the strip's auto-scaling. MAX matches
        // the size this view shipped with (comfortable at today's real span
        // of ~198 days); MIN is the smallest a square can shrink to before
        // this view stops shrinking and lets `.strip-scroll` take over with
        // horizontal scrolling instead of rendering an unreadable grey
        // smear. 4px is still an individually distinguishable, hoverable
        // square at typical screen DPI — smaller than that stops reading as
        // "a square" at all.
        const STRIP_MAX_CELL_PX = 11;
        const STRIP_MIN_CELL_PX = 4;

        // Renders the strip as GitHub-contribution-style squares: weeks as
        // flex columns (Sunday-aligned, matching the CRM heatmap in
        // web/crm.html), with month labels running along the top. Unlike
        // the CRM heatmap, color encodes *which* emotion (a flat hue per
        // primary emotion), never an intensity ramp — a day either has an
        // entry (its primary's color) or it doesn't (the gap background).
        //
        // Always spans the full history the API returns (earliest valid
        // entry through today) — this view takes no `window` parameter and
        // ignores the page's window selector entirely, labeled explicitly
        // via the "Full history" badge next to its heading so that doesn't
        // read as a bug.
        function renderStrip(data) {
            const note = document.getElementById('stripNote');
            const body = document.getElementById('stripBody');
            const { total_entries, emotion_entries, start_date, end_date, days } = data;
            if (!days.length) {
                note.innerHTML = 'No journal entries recorded yet.';
                body.innerHTML = '';
                return;
            }
            note.innerHTML = `<strong>${emotion_entries}</strong> of <strong>${total_entries}</strong> ` +
                `entries logged a feeling, across every day from your earliest entry ` +
                `(<strong>${start_date}</strong>) through today (<strong>${end_date}</strong>) — ` +
                `<strong>${days.length}</strong> calendar days total, always full history regardless of ` +
                `the window selector above. Every day in the span gets a square — gaps are shown, not skipped.`;

            const byDate = new Map(days.map((d) => [d.date, d]));
            const rangeStart = new Date(days[0].date + 'T00:00:00Z');
            const rangeEnd = new Date(days[days.length - 1].date + 'T00:00:00Z');
            const gridStart = new Date(rangeStart);
            gridStart.setUTCDate(gridStart.getUTCDate() - gridStart.getUTCDay());
            const gridEnd = new Date(rangeEnd);
            gridEnd.setUTCDate(gridEnd.getUTCDate() + (6 - gridEnd.getUTCDay()));

            const weeks = [];
            const monthLabels = [];
            let lastMonth = -1;
            let colIndex = 0;
            for (let cur = new Date(gridStart); cur <= gridEnd; cur.setUTCDate(cur.getUTCDate() + 7)) {
                const cells = [];
                for (let i = 0; i < 7; i++) {
                    const day = new Date(cur);
                    day.setUTCDate(day.getUTCDate() + i);
                    const inRange = day >= rangeStart && day <= rangeEnd;
                    if (i === 0 && inRange) {
                        const month = day.getUTCMonth();
                        if (month !== lastMonth) {
                            monthLabels.push({ colIndex, label: day.toLocaleDateString('en-US', { month: 'short', timeZone: 'UTC' }) });
                            lastMonth = month;
                        }
                    }
                    cells.push(inRange ? stripDayCell(byDate.get(day.toISOString().slice(0, 10))) : stripDayCell(null));
                }
                weeks.push(`<div class="strip-week">${cells.join('')}</div>`);
                colIndex++;
            }

            const totalCols = colIndex;
            const monthsHtml = monthLabels.map((m, i) => {
                const span = (monthLabels[i + 1] ? monthLabels[i + 1].colIndex : totalCols) - m.colIndex;
                return `<div class="strip-month-label" style="flex:${span}">${m.label}</div>`;
            }).join('');

            body.innerHTML = `<div class="strip-scroll" id="stripScroll"><div class="strip-months">${monthsHtml}</div>` +
                `<div class="strip-grid" id="stripGrid">${weeks.join('')}</div></div>` +
                `<div class="strip-legend">` +
                `<span><span class="strip-legend-swatch" style="background:var(--bg-secondary);border:1px solid var(--border)"></span>no entry that day (gap)</span>` +
                `<span><span class="strip-legend-swatch" style="background:var(--bg-secondary);border:1px dashed var(--text-secondary)"></span>entry, no feeling logged</span>` +
                `<span><span class="strip-legend-swatch" style="background:${colorFor('Happy')}"></span>colored by primary emotion (hue is deterministic per value, hover for the exact label) — flat color, never shaded by intensity</span>` +
                `</div>`;

            // Auto-scale cells to fit the full span in the available width.
            // Rendered above at STRIP_MAX_CELL_PX; if that overflows the
            // scroll container, shrink toward STRIP_MIN_CELL_PX. If even the
            // floor doesn't fit, keep the floor size and let the container
            // scroll horizontally (`.strip-scroll` already has
            // `overflow-x: auto`) rather than shrinking into illegibility.
            const scrollEl = document.getElementById('stripScroll');
            const gridEl = document.getElementById('stripGrid');
            const available = scrollEl.clientWidth;
            const natural = gridEl.scrollWidth;
            if (natural > available && totalCols > 0) {
                const gapPx = 2;
                const idealCell = (available - (totalCols - 1) * gapPx) / totalCols;
                const cell = Math.max(STRIP_MIN_CELL_PX, Math.floor(idealCell));
                gridEl.style.setProperty('--cell', `${cell}px`);
            }
        }

        // ---- View D: scalar stack ----

        function renderSparkline(field, points, startDate, endDate) {
            const totalDays = Math.max(dayOffset(endDate, startDate), 1);
            const width = Math.max(totalDays * 4, 200);
            const height = 40;
            const pad = 4;
            if (!points.length) {
                return `<svg viewBox="0 0 ${width} ${height}"></svg>`;
            }
            const values = points.map((p) => p.value);
            const minV = Math.min(...values);
            const maxV = Math.max(...values);
            const span = maxV - minV || 1;
            const xy = points.map((p) => {
                const x = pad + (dayOffset(p.date, startDate) / totalDays) * (width - 2 * pad);
                const y = height - pad - ((p.value - minV) / span) * (height - 2 * pad);
                return { x, y, date: p.date, value: p.value };
            });
            const parts = [];
            for (let i = 1; i < xy.length; i++) {
                const gap = dayOffset(xy[i].date, xy[i - 1].date);
                // Never draw a connecting line across a gap of more than one
                // calendar day — this data is non-contiguous by nature, and a
                // line between entries weeks apart would imply a trend the
                // sample doesn't support.
                if (gap <= 1) {
                    parts.push(`<line x1="${xy[i - 1].x}" y1="${xy[i - 1].y}" x2="${xy[i].x}" y2="${xy[i].y}" stroke="${colorFor(field)}" stroke-width="1.5" />`);
                }
            }
            for (const p of xy) {
                parts.push(`<circle cx="${p.x}" cy="${p.y}" r="2.5" fill="${colorFor(field)}"><title>${escapeHtml(p.date)}: ${p.value}</title></circle>`);
            }
            return `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">${parts.join('')}</svg>`;
        }

        // Plain-language reading of one pair's correlation. Deliberately
        // symmetric in wording ("also tends to be higher/lower") rather than
        // asserting cause in either direction — the same "co-movement, not
        // causation" boundary the demoted r-footnote states numerically.
        function pairSentence(a, b, n, r) {
            if (r === null || r === undefined) {
                return `Not enough paired ${a}/${b} entries in this window (n=${n}) to see a pattern.`;
            }
            if (Math.abs(r) < 0.1) {
                return `${a[0].toUpperCase()}${a.slice(1)} and ${b} show no clear pattern together in this window.`;
            }
            const direction = r > 0 ? 'also tends to be higher' : 'tends to be lower';
            return `On days rated higher for ${a}, ${b} ${direction}.`;
        }

        // The paired (x, y) points for one field pair, matched by date —
        // computed client-side from the already-fetched per-field series
        // rather than the backend re-shipping the same points twice.
        function pairedPoints(seriesByField, a, b) {
            const A = new Map(seriesByField[a].points.map((p) => [p.date, p.value]));
            const B = new Map(seriesByField[b].points.map((p) => [p.date, p.value]));
            const dates = [...A.keys()].filter((d) => B.has(d));
            return dates.map((d) => ({ date: d, x: A.get(d), y: B.get(d) }));
        }

        // One small, individually-labeled scatter: no fitted line (a
        // regression at n as low as 2-5 would imply confidence the sample
        // can't support — the same principle the sparklines' "never bridge
        // a gap" rule follows), axis ticks at the observed min/max so the
        // plot is readable without a shared external scale.
        function renderScatterSvg(points) {
            if (!points.length) {
                return '<div class="scatter-empty">No paired data in this window.</div>';
            }
            const size = 160;
            const pad = 20;
            const xs = points.map((p) => p.x);
            const ys = points.map((p) => p.y);
            const minX = Math.min(...xs), maxX = Math.max(...xs);
            const minY = Math.min(...ys), maxY = Math.max(...ys);
            const spanX = (maxX - minX) || 1;
            const spanY = (maxY - minY) || 1;
            const toX = (v) => pad + ((v - minX) / spanX) * (size - 2 * pad);
            const toY = (v) => (size - pad) - ((v - minY) / spanY) * (size - 2 * pad);
            const dots = points.map((p) =>
                `<circle cx="${toX(p.x)}" cy="${toY(p.y)}" r="3" fill="${colorFor('scatter')}" opacity="0.75">` +
                `<title>${escapeHtml(p.date)}: ${p.x} / ${p.y}</title></circle>`
            ).join('');
            return `<svg viewBox="0 0 ${size} ${size}" class="scatter-svg" preserveAspectRatio="xMidYMid meet">` +
                `<line x1="${pad}" y1="${size - pad}" x2="${size - pad}" y2="${size - pad}" stroke="var(--border)" />` +
                `<line x1="${pad}" y1="${pad}" x2="${pad}" y2="${size - pad}" stroke="var(--border)" />` +
                `<text x="${pad}" y="${size - 4}" font-size="8" fill="var(--text-secondary)">${minX}</text>` +
                `<text x="${size - pad - 12}" y="${size - 4}" font-size="8" fill="var(--text-secondary)">${maxX}</text>` +
                `<text x="2" y="${size - pad}" font-size="8" fill="var(--text-secondary)">${minY}</text>` +
                `<text x="2" y="${pad + 6}" font-size="8" fill="var(--text-secondary)">${maxY}</text>` +
                dots + `</svg>`;
        }

        function renderScalars(data) {
            const note = document.getElementById('scalarNote');
            const corr = document.getElementById('correlationNote');
            const body = document.getElementById('scalarBody');
            const { total_entries, series, start_date, end_date, correlations } = data;
            const rangeText = start_date ? `${start_date} to ${end_date}` : `through ${end_date}`;
            const anyPoints = series.some((s) => s.points.length);
            if (!anyPoints) {
                note.innerHTML = `No mood/stress/sleep/body data in this window (${rangeText}).`;
                corr.innerHTML = '';
                body.innerHTML = '';
                return;
            }
            note.innerHTML = `<strong>${total_entries}</strong> journal entr${total_entries === 1 ? 'y' : 'ies'} ` +
                `in this window (${rangeText}). Dots mark entries; a line is drawn only between entries on ` +
                `consecutive calendar days — everything else is a gap, on purpose.`;

            // Stated once, above every pair — identical for all six because
            // every self-reported scalar field shares the same ambiguity,
            // not something worth repeating six times over.
            corr.innerHTML = `The journal form does not label which direction of any of these four scales is ` +
                `"better" — a relationship below may mean the two genuinely move together, or that one field ` +
                `is effectively reverse-coded relative to the other. Each chart plots one dot per entry with ` +
                `both values logged; no line is fitted, since a sample this small can't support one.`;

            const seriesByField = {};
            series.forEach((s) => { seriesByField[s.field] = s; });

            const gridStart = start_date || (series.find((s) => s.points.length)?.points[0]?.date);
            const gridEnd = end_date;
            const sparklines = series.map((s) => {
                return `<div class="scalar-row"><span class="scalar-label">${escapeHtml(s.field)}</span>` +
                    renderSparkline(s.field, s.points, gridStart, gridEnd) + `</div>`;
            }).join('');

            const scatterCells = correlations.map((c) => {
                const [a, b] = c.pair;
                const points = pairedPoints(seriesByField, a, b);
                const sentence = pairSentence(a, b, c.n, c.r);
                const rText = c.r === null || c.r === undefined ? 'n/a' : (c.r >= 0 ? '+' : '') + c.r.toFixed(2);
                return `<div class="scatter-cell">` +
                    `<div class="scatter-title">${escapeHtml(a)} vs. ${escapeHtml(b)}</div>` +
                    `<div class="scatter-sentence">${escapeHtml(sentence)}</div>` +
                    `<div class="scatter-chart-row"><span class="scatter-y-label">${escapeHtml(b)}</span>${renderScatterSvg(points)}</div>` +
                    `<div class="scatter-x-label">${escapeHtml(a)}</div>` +
                    `<div class="scatter-footnote">r = ${rText} (n=${c.n})</div>` +
                    `</div>`;
            }).join('');

            body.innerHTML = sparklines +
                `<h3 style="font-size:0.95rem;margin:1rem 0 0.2rem;">How the four measures relate</h3>` +
                `<div class="scatter-grid">${scatterCells}</div>`;
        }

        // ---- View B: the unexplored wheel ----

        // A colour *family* per primary-emotion group: one hue per group
        // (hashed from the group name, so it's stable across reloads),
        // varying only lightness/saturation per branch within that family
        // — so a glance at the wheel or legend shows which family a branch
        // belongs to. "Unplaced" gets a neutral (zero-saturation) family
        // instead of a hue, since it isn't a real emotion family — it's an
        // honest "don't know yet" bucket. This is the one place on this
        // page intensity-style shading *is* wanted (feedback item 1's "no
        // variable shading" applies to the strip only).
        function familyColor(group, label) {
            const h2 = fnv1aHue(label);
            if (group === 'Unplaced') {
                const light = 30 + (h2 % 30);
                return `hsl(0, 0%, ${light}%)`;
            }
            const hue = fnv1aHue(group);
            const sat = 50 + (h2 % 30);
            const light = 40 + ((h2 >> 4) % 30);
            return `hsl(${hue}, ${sat}%, ${light}%)`;
        }

        function renderTaxonomy(data) {
            const note = document.getElementById('taxonomyNote');
            const body = document.getElementById('taxonomyBody');
            const { total_entries, emotion_entries, taxonomy_source, branches, extra_used, group_order } = data;

            const sourceText = taxonomy_source === 'form'
                ? `${branches.length} branches derived from the journal form's own questions, grouped by ` +
                  `primary emotion. "Not sure" is excluded entirely — it's a non-answer, not an emotion.`
                : `Form taxonomy unavailable (no gsheet_sync.db, or no matching columns) — showing only ` +
                  `values actually used, same as the emotion wheel's flat legend. This is a real degraded ` +
                  `mode, not an error.`;
            note.innerHTML = `<strong>${emotion_entries}</strong> of <strong>${total_entries}</strong> entries ` +
                `logged a feeling in this window. ${sourceText}`;

            const all = branches.concat(extra_used);
            if (!all.length) {
                body.innerHTML = '<div class="empty-state">No emotion vocabulary observed or available in this window.</div>';
                return;
            }

            const byGroup = new Map();
            all.forEach((b) => {
                if (!byGroup.has(b.group)) byGroup.set(b.group, []);
                byGroup.get(b.group).push(b);
            });
            byGroup.forEach((items) => items.sort((x, y) => (y.count - x.count) || x.label.localeCompare(y.label)));
            const groupsPresent = group_order.filter((g) => byGroup.has(g));

            // Slots interleave real items with `null` gap markers between
            // groups, so every group's wedges land contiguously on the
            // wheel with a small visible break before the next family.
            const slots = [];
            groupsPresent.forEach((g, gi) => {
                byGroup.get(g).forEach((b) => slots.push(b));
                if (gi < groupsPresent.length - 1) slots.push(null);
            });

            const maxCount = Math.max(1, ...all.map((b) => b.count));
            const rInner = 26;
            const rOuter = 128;
            const n = slots.length;
            const angle = (2 * Math.PI) / n;
            const parts = [];
            slots.forEach((b, i) => {
                if (!b) return; // gap between groups — nothing drawn
                const a0 = -Math.PI / 2 + i * angle;
                const a1 = a0 + angle * 0.85; // small gap between wedges within a group
                const color = familyColor(b.group, b.label);
                if (b.used) {
                    const len = rInner + (b.count / maxCount) * (rOuter - rInner);
                    parts.push(`<path d="${arcPath(140, 140, rInner, len, a0, a1)}" fill="${color}" opacity="0.9"><title>${escapeHtml(b.group)} → ${escapeHtml(b.label)}: ${b.count}</title></path>`);
                } else {
                    parts.push(`<path d="${arcPath(140, 140, rInner, rInner + 18, a0, a1)}" fill="none" stroke="${color}" stroke-width="1.5" opacity="0.6"><title>${escapeHtml(b.group)} → ${escapeHtml(b.label)}: not used in this window</title></path>`);
                }
            });
            const svg = `<svg id="taxonomySvg" viewBox="0 0 280 280">${parts.join('')}</svg>`;

            const legend = groupsPresent.map((g) => {
                const rows = byGroup.get(g).map((b) => {
                    const cls = b.used ? 'taxonomy-row' : 'taxonomy-row unused';
                    const color = familyColor(b.group, b.label);
                    const swatchStyle = b.used ? `background:${color}` : `border:1px solid ${color};background:none`;
                    return `<div class="${cls}"><span class="taxonomy-swatch" style="${swatchStyle}"></span>` +
                        `<span>${escapeHtml(b.label)}</span>` +
                        `<span class="taxonomy-count">${b.used ? b.count : 'unused'}</span></div>`;
                }).join('');
                return `<div class="taxonomy-group"><div class="taxonomy-group-header">${escapeHtml(g)}</div>${rows}</div>`;
            }).join('');

            body.innerHTML = `<div class="wheel-flex">${svg}<div class="taxonomy-legend">${legend}</div></div>`;
        }

        // ---- orchestration ----

        // The strip takes no `window` — it always shows full history (see
        // renderStrip above) — so it's fetched once, independent of the
        // window selector, rather than re-fetched on every pill click for
        // data that can never change as a result.
        async function loadStrip() {
            try {
                renderStrip(await fetchJson('/api/journal/strip'));
            } catch (err) {
                document.getElementById('stripNote').textContent = `Failed to load: ${err.message}`;
            }
        }

        async function loadAll(win) {
            currentWindow = win;
            document.querySelectorAll('.window-pill').forEach((p) => {
                p.classList.toggle('active', p.dataset.window === win);
            });

            const q = `window=${encodeURIComponent(win)}`;
            try {
                const [scalars, taxonomy] = await Promise.all([
                    fetchJson(`/api/journal/scalars?${q}`),
                    fetchJson(`/api/journal/taxonomy?${q}`),
                ]);
                renderScalars(scalars);
                renderTaxonomy(taxonomy);
            } catch (err) {
                document.getElementById('scalarNote').textContent = `Failed to load: ${err.message}`;
            }
        }

        document.getElementById('windowSelector').addEventListener('click', (e) => {
            const pill = e.target.closest('.window-pill');
            if (pill) loadAll(pill.dataset.window);
        });

        loadStrip();
        loadAll(currentWindow);
    </script>
</body>
</html>
